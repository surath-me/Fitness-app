};

/* =====================================================================
   GESTURES: swipe to delete, drag sheet to dismiss
   ===================================================================== */
let sw = null, sd = null;
function closeSwipes(except){ $$('.swipe.opened').forEach(r => { if (r !== except) { r.classList.remove('opened'); $('.swipe-fg', r).style.transform = ''; } }); }
document.addEventListener('pointerdown', e => {
  const head = e.target.closest('.sheet-head');
  if (head && !e.target.closest('button')) { sd = { y0:e.clientY, id:e.pointerId, dy:0 }; $('#sheet').classList.add('dragging'); return; }
  const fg = e.target.closest('.swipe-fg');
  if (!fg) { if (!e.target.closest('.swipe-del')) closeSwipes(); return; }
  const row = fg.parentElement; closeSwipes(row);
  sw = { row, fg, x0:e.clientX, y0:e.clientY, base: row.classList.contains('opened') ? -92 : 0, raw:0, x:0, active:false, id:e.pointerId };
}, { passive:true });
document.addEventListener('pointermove', e => {
  if (sd && e.pointerId === sd.id) { sd.dy = Math.max(0, e.clientY - sd.y0); $('#sheet').style.transform = `translateY(${sd.dy}px)`; $('#scrim').style.opacity = String(Math.max(0, 1 - sd.dy / 420)); return; }
  if (!sw || e.pointerId !== sw.id) return;
  const dx = e.clientX - sw.x0, dy = e.clientY - sw.y0;
  if (!sw.active) {
    if (Math.abs(dx) > 8 && Math.abs(dx) > Math.abs(dy) * 1.2) { sw.active = true; sw.row.classList.add('dragging'); }
    else if (Math.abs(dy) > 8) { sw = null; return; } else return;
  }
  sw.raw = sw.base + dx;
  let x = sw.raw; if (x > 0) x *= 0.25; if (x < -92) x = -92 + (x + 92) * 0.35;
  sw.x = x; sw.fg.style.transform = `translateX(${x}px)`;
}, { passive:true });
function endGesture(){
  if (sd) { const el = $('#sheet'), dy = sd.dy; sd = null; el.classList.remove('dragging'); $('#scrim').style.opacity = '';
    if (dy > 110) { el.style.transform = 'translateY(calc(100% + 40px))'; ui.sheet = null; drawSheet(); } else el.style.transform = ''; }
  if (sw) { const s = sw; sw = null; if (!s.active) return; ui.swipeAt = Date.now(); s.row.classList.remove('dragging');
    if (s.raw < -230) { s.fg.style.transform = 'translateX(-100%)'; removeEntryAnimated(s.row.dataset.id); return; }
    if (s.x < -46) { s.row.classList.add('opened'); s.fg.style.transform = 'translateX(-92px)'; } else { s.row.classList.remove('opened'); s.fg.style.transform = ''; } }
}
document.addEventListener('pointerup', endGesture);
document.addEventListener('pointercancel', endGesture);

/* ---------- Liquid Glass touch: light from the fingertip, lenses you can drag, week swipe ---------- */
const LIT = '.btn,.qchip,.tbtn,.closeb,.accessory .tb,.glass';
let lit = [], td = null, sg = null, wk = null, eb = null;
function unlight(){ lit.forEach(g => g.classList.remove('lit')); lit = []; }
function lightUp(g, e){
  const r = g.getBoundingClientRect();
  g.style.setProperty('--px', (e.clientX - r.left) + 'px'); g.style.setProperty('--py', (e.clientY - r.top) + 'px');
  g.classList.add('lit'); lit.push(g);
}
/* after a drag, let the thumb spring from where the finger left it */
function settleFrom(el, fromLeft){
  if (!el || reduced()) return;
  const d = fromLeft - el.getBoundingClientRect().left; if (Math.abs(d) < 1) return;
  el.animate([{ transform:`translateX(${d}px)` }, { transform:'none' }], { duration:520, easing:EASE.spring });
}
document.addEventListener('touchstart', () => {}, { passive:true });   // lets :active work on iOS
document.addEventListener('pointerdown', e => {
  unlight();
  const g = e.target.closest(LIT);
  if (g && !g.closest('.tabbar') && !g.matches('.menu,.sheet,.alert')) {
    lightUp(g, e);
    const grp = g.parentElement && g.parentElement.closest('.tgroup'); if (grp) lightUp(grp, e);   // the glow spreads to the shared glass
  }
  if (e.target.closest('#tabs')) td ={ id:e.pointerId, x0:e.clientX, drag:false };
  const seg = e.target.closest('.seg');
  if (seg) {
    const btns = $$('button', seg), i = btns.findIndex(b => b.getAttribute('aria-pressed') === 'true');
    sg = { seg, btns, i, id:e.pointerId, x0:e.clientX, onSel: e.target.closest('button') === btns[i], drag:false, dx:0 };
    seg.classList.add('lens'); clearTimeout(seg._lt);
  }
  if (e.target.closest('.week')) wk = { id:e.pointerId, x0:e.clientX, y0:e.clientY };
  if (ui.tab === 'setup' && ui.setupPage && e.clientX < 28 && !ui.sheet) eb = { id:e.pointerId, x0:e.clientX, y0:e.clientY };   // swipe from the left edge to go back
}, { passive:true });
document.addEventListener('pointermove', e => {
  if (td && e.pointerId === td.id) {
    const ind = $('#tabind');
    if (!td.drag) { if (Math.abs(e.clientX - td.x0) < 8) return; td.drag = true; ind.classList.add('lens'); clearTimeout(ind._lt); unlight(); }
    const r = $('#tabs').getBoundingClientRect(), w = ind.offsetWidth;
    const cx = Math.max(4 + w / 2, Math.min(r.width - 4 - w / 2, e.clientX - r.left));
    td.x = cx - w / 2; ind.style.transform = `translateX(${td.x - ind.offsetLeft}px)`;
    $$('#tabs .tab').forEach(b => b.classList.toggle('mag', Math.abs(b.offsetLeft + b.offsetWidth / 2 - cx) < w * .5));
  }
  if (sg && e.pointerId === sg.id && sg.onSel) {
    const th = $('.seg-thumb', sg.seg), dx = e.clientX - sg.x0; if (!th) return;
    if (!sg.drag) { if (Math.abs(dx) < 6) return; sg.drag = true; sg.seg.classList.add('drag'); }
    sg.dx = Math.max(3 - th.offsetLeft, Math.min(sg.seg.clientWidth - 3 - th.offsetWidth - th.offsetLeft, dx));
    th.style.transform = `translateX(${sg.dx}px)`;
    const c = th.offsetLeft + sg.dx + th.offsetWidth / 2;
    sg.btns.forEach(b => b.classList.toggle('mag', Math.abs(b.offsetLeft + b.offsetWidth / 2 - c) < th.offsetWidth * .5));
  }
}, { passive:true });
function endLiquid(e){
  unlight();
  if (td && e.pointerId === td.id) {
    const t = td; td = null;
    if (t.drag) {
      const ind = $('#tabind'), tabs = $$('#tabs .tab'), i = Math.max(0, Math.min(tabs.length - 1, Math.round((t.x - 4) / ind.offsetWidth)));
      ind.style.transform = ''; tabs.forEach(b => b.classList.remove('mag')); ui.tabDragAt = Date.now();
      H.tab(tabs[i], null, t.x);
    }
  }
  if (sg && e.pointerId === sg.id) {
    const s = sg, key = s.seg.getAttribute('aria-label') || '', th = $('.seg-thumb', s.seg); sg = null;
    s.btns.forEach(b => b.classList.remove('mag'));
    if (s.drag && th) {
      const from = th.getBoundingClientRect().left, c = th.offsetLeft + s.dx + th.offsetWidth / 2;
      const j = Math.max(0, Math.min(s.btns.length - 1, Math.floor((c - 3) / ((s.seg.clientWidth - 6) / s.btns.length))));
      th.style.transform = '';
      if (j !== s.i) { segMemo[key] = j; s.btns[j].click(); }
      const seg2 = s.seg.isConnected ? s.seg : $$('.seg').find(x => (x.getAttribute('aria-label') || '') === key);
      if (seg2) { settleFrom($('.seg-thumb', seg2), from); lensFlash(seg2, 260); setTimeout(() => seg2.classList.remove('drag'), 540); }
    } else lensFlash(s.seg, 220);
  }
  if (eb && e.pointerId === eb.id) {
    const dx = e.clientX - eb.x0, dy = e.clientY - eb.y0; eb = null;
    if (e.type === 'pointerup' && dx > 70 && Math.abs(dx) > Math.abs(dy) * 1.5) H.setupback();
  }
  if (wk && e.pointerId === wk.id) {
    const w = wk, dx = e.clientX - w.x0, dy = e.clientY - w.y0; wk = null;
    if (e.type === 'pointerup' && Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy) * 1.5) { ui.weekAt = Date.now(); go(addDays(ui.date, dx < 0 ? 7 : -7)); }
  }
}
document.addEventListener('pointerup', endLiquid);
document.addEventListener('pointercancel', endLiquid);

  const t = e.target.closest('[data-act]');

        if (!obj || !obj.settings || !obj.workouts) throw new Error('bad'); S = migrate(obj); saveState(); render(); toast('Backup imported'); }

document.addEventListener('keydown', e => {

});
let scrollRaf = 0;
window.addEventListener('scroll', () => { if (scrollRaf) return; scrollRaf = requestAnimationFrame(() => { scrollRaf = 0; onScroll(); }); }, { passive:true });

let _today = todayStr();

  if (!document.hidden && !$('#timer').classList.contains('ghost')) tickRest();
});

/* =====================================================================
   CLOUD SYNC: an optional private copy in Upstash Redis through /api/sync.
   The device stays the source of truth and works offline; a few seconds after a change,
   when the app opens and when it comes back online, it swaps changes with the cloud.
   When both sides changed, they are merged day by day against the last synced copy.
   ===================================================================== */
const SYNC_KEY = 'coach-sync', SYNC_BASE = 'coach-sync-base';
const cloud = (() => { try { return JSON.parse(localStorage.getItem(SYNC_KEY)) || {}; } catch(e) { return {}; } })();   // token, rev, lastSync, lastFrom, status
let syncBase, syncing = null, syncAgain = false, syncTimer = 0;
const sameJSON = (a, b) => JSON.stringify(a) === JSON.stringify(b);
const entrySig = e => JSON.stringify([e.name, e.slot, e.unit, e.qty, e.kcal, e.p, e.f, e.c]);
function cloudSave(){ try { localStorage.setItem(SYNC_KEY, JSON.stringify(cloud)); } catch(e) {} }
function getBase(){ if (syncBase === undefined) { try { syncBase = JSON.parse(localStorage.getItem(SYNC_BASE)); } catch(e) { syncBase = null; } } return syncBase; }
function setBase(st){ syncBase = st ? deepClone(st) : null; try { st ? localStorage.setItem(SYNC_BASE, JSON.stringify(syncBase)) : localStorage.removeItem(SYNC_BASE); } catch(e) {} }
function deviceName(){
  if (navigator.standalone || (window.matchMedia && matchMedia('(display-mode: standalone)').matches)) return 'Home Screen app';
  return /iPhone|iPad/.test(navigator.userAgent) ? 'Safari on iPhone' : /Macintosh/.test(navigator.userAgent) ? 'Mac browser' : 'browser';
}
const agoText = ms => { const m = Math.round((Date.now() - ms) / 60000); return m < 1 ? 'just now' : m < 60 ? `${m} min ago` : m < 1440 ? `${Math.round(m / 60)} h ago` : dateLabel(fmtD(new Date(ms))); };
function cloudLine(){
  if (!cloud.token) return 'Off';
  return { auth:'Passphrase not accepted', setup:'Not set up on the server', offline:'Offline, syncs when back online', error:'Sync failed, will retry' }[cloud.status]
    || (cloud.lastSync ? `Synced ${agoText(cloud.lastSync)}` : 'Waiting to sync');
}

/* merge two copies that both moved on from `base` (null on the first sync, so everything counts as changed) */
function merge3(base, a, b){
  const out = { ...deepClone(b), ...deepClone(a) }, O = base || {};
  const pick = (ov, av, bv, both) => sameJSON(av, bv) ? av : sameJSON(av, ov) ? bv : sameJSON(bv, ov) ? av : both(av, bv);
  const byDate = {
    days: (x, y) => { if (!x || !y) return x || y;
      // real logged food beats an imported day total (an estimate from the chat logs) for the same day
      const real = d => d.entries.some(e => e.slot !== 'imported');
      if (real(x) !== real(y)) return real(x) ? x : y;
      // the same food logged identically on both sides (like the starter day totals every install creates) is kept once
      const ids = new Set(x.entries.map(e => e.id)), sigs = new Set(x.entries.map(entrySig));
      return { ...y, ...x, entries: [...x.entries, ...y.entries.filter(e => !ids.has(e.id) && !sigs.has(entrySig(e)))] }; },
    workouts: (x, y) => { if (!x || !y) return x || y;
      const ex = { ...y.ex };
      Object.entries(x.ex || {}).forEach(([id, sets]) => { const done = l => (l || []).filter(s => +s.r > 0).length; if (!ex[id] || done(sets) >= done(ex[id])) ex[id] = sets; });
      return { ...y, ...x, ex, added: [...new Set([...(y.added || []), ...(x.added || [])])] }; },
    water: (x, y) => (!x || !y) ? x || y : { ml: Math.max(x.ml || 0, y.ml || 0), creatine: !!(x.creatine || y.creatine) },
    dismissed: (x, y) => x || y
  };
  Object.entries(byDate).forEach(([k, both]) => {
    const A = a[k] || {}, B = b[k] || {}, OO = O[k] || {}, r = {};
    new Set([...Object.keys(A), ...Object.keys(B), ...Object.keys(OO)]).forEach(d => { const v = pick(OO[d], A[d], B[d], both); if (v !== undefined) r[d] = deepClone(v); });
    out[k] = r;
  });
  const union = key => (x, y) => { const seen = new Set((x || []).map(key)); return [...(x || []), ...(y || []).filter(i => !seen.has(key(i)))]; };
  out.waist = deepClone(pick(O.waist, a.waist, b.waist, union(w => w.date)) || []);
  out.foods = deepClone(pick(O.foods, a.foods, b.foods, union(f => JSON.stringify([f.name, f.unit, f.kcal, f.p, f.f, f.c]))) || []);
  out.settings = deepClone(pick(O.settings, a.settings, b.settings, x => x));
  const starts = [a.settings && a.settings.planStart, b.settings && b.settings.planStart].filter(Boolean).sort();
  if (starts.length) out.settings.planStart = starts[0];
  return out;
}

async function cloudApi(method, body, query = ''){
  const r = await fetch('/api/sync' + query, { method, cache:'no-store',
    headers: Object.assign({ Authorization: 'Bearer ' + cloud.token }, body ? { 'Content-Type':'application/json' } : {}),
    body: body ? JSON.stringify(body) : undefined });
  let data = null; try { data = await r.json(); } catch(e) {}
  return { status: r.status, data };
}
const pushBody = () => ({ baseRev: cloud.rev || 0, state: S, device: deviceName(), day: todayStr() });
function setCloud(status){ cloud.status = status; cloudSave(); if (ui.tab === 'setup') refreshSetup(); }
function refreshSetup(){ const a = document.activeElement; if (!ui.sheet && !(a && /INPUT|SELECT|TEXTAREA/.test(a.tagName))) render(); }
function scheduleSync(ms = 4000){ if (!cloud.token) return; clearTimeout(syncTimer); syncTimer = setTimeout(syncNow, ms); }

function syncNow(){
  if (!cloud.token) return Promise.resolve();
  if (syncing) { syncAgain = true; return syncing; }
  clearTimeout(syncTimer); syncTimer = 0;
  syncing = (async () => {
    try {
      const base = getBase(), dirty = !base || !sameJSON(base, S);
      let res = dirty ? await cloudApi('PUT', pushBody()) : await cloudApi('GET', null, `?rev=${cloud.rev || 0}`);
      if (res.status === 401) return setCloud('auth');
      if (res.status === 503) return setCloud('setup');
      if (res.status === 200 && res.data && (res.data.same || res.data.empty)) { if (res.data.empty) { cloud.rev = 0; setBase(null); syncAgain = true; } cloud.lastSync = Date.now(); return setCloud('ok'); }
      if (res.status === 200 && dirty) { cloud.rev = res.data.rev; setBase(S); cloud.lastSync = Date.now(); cloud.lastFrom = deviceName(); return setCloud('ok'); }
      if ((res.status === 200 || res.status === 409) && res.data && res.data.state) {
        // the cloud moved on: fold its changes in, keep this device's, then send the result back if it differs
        const theirs = res.data.state, merged = migrate(merge3(base, S, theirs));
        cloud.rev = res.data.rev; cloud.lastFrom = res.data.device || cloud.lastFrom;
        const showsChange = !sameJSON(merged, S);
        S = merged; saveLocal(); setBase(theirs);
        if (!sameJSON(merged, theirs)) {
          const put = await cloudApi('PUT', pushBody());
          if (put.status === 200) { cloud.rev = put.data.rev; setBase(S); cloud.lastFrom = deviceName(); } else syncAgain = true;
        }
        cloud.lastSync = Date.now(); setCloud('ok');
        if (showsChange && ui.tab !== 'setup') refreshSetup();
        return;
      }
      setCloud('error');
    } catch(e) { setCloud(navigator.onLine === false ? 'offline' : 'error'); }
    finally { syncing = null; if (syncAgain) { syncAgain = false; scheduleSync(1500); } }
  })();
  return syncing;
}
function cloudOff(){ clearTimeout(syncTimer); ['token','rev','lastSync','lastFrom','status'].forEach(k => delete cloud[k]); cloudSave(); setBase(null); }
Object.assign(H, {
  async cloudconnect(){
    const v = ($('#cloudpass') && $('#cloudpass').value || '').trim();
    if (!v) { toast('Enter the passphrase first'); return; }
    cloud.token = v; cloud.rev = 0; delete cloud.status; setBase(null);
    let res = null; try { res = await cloudApi('GET', null, '?rev=-1'); } catch(e) {}
    const fail = m => { cloudOff(); toast(m); };
    if (!res) return fail('No connection. Try again when you have signal.');
    if (res.status === 401) return fail('That passphrase is not right');
    if (res.status === 503) return fail('Cloud backup is not set up on the server yet');
    if (res.status !== 200) return fail('The cloud did not answer. Try again later.');
    if (res.data && res.data.state) {   // the cloud already has data: combine it with this device's
      S = migrate(merge3(null, S, res.data.state)); saveLocal(); setBase(res.data.state); cloud.rev = res.data.rev; cloud.lastFrom = res.data.device;
    }
    cloudSave(); await syncNow(); render(); toast(cloud.status === 'ok' ? 'Cloud backup is on' : cloudLine());
  },
  cloudsync(){ if (!cloud.token) return; syncNow().then(() => toast(cloud.status === 'ok' ? 'Synced' : cloudLine())); },
  clouddisconnect(){ askGlass('Turn off cloud backup here?', 'Your data stays on this device and in the cloud. This device just stops syncing.', 'Turn off').then(ok => {
    if (!ok) return; cloudOff(); render(); toast('Cloud backup is off on this device'); }); }
});
window.addEventListener('online', () => syncNow());
document.addEventListener('visibilitychange', () => { if (!cloud.token) return; if (document.hidden) { if (syncTimer) syncNow(); } else syncNow(); });

if (typeof window !== 'undefined') window.__coach = { S: () => S, setS: v => { S = v; }, ui, render, getPlan, suggest, suggestGap, H, dayType, sumMacros, addEntry, foodById, mergeHistory, saveState: () => saveState(), cloud, syncNow, merge3, planDay };
render();
if (cloud.token) syncNow();
</script>
