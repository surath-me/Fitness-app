<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F2F2F7">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Coach">
<meta name="application-name" content="Coach">
<meta name="color-scheme" content="light">
<meta name="format-detection" content="telephone=no">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="manifest" href="manifest.webmanifest">
<title>Coach</title>
<style>
@property --lit{syntax:'<number>';inherits:false;initial-value:0}
:root{
  --bg:#F2F2F7; --card:#FFFFFF; --ink:#000; --ink2:#6C6C70; --ink3:#AEAEB2;
  --sep:rgba(60,60,67,.14); --fill:rgba(120,120,128,.16); --fill2:rgba(120,120,128,.10);
  --accent:#0088FF; --accent-press:#006FD6; --accent-t:rgba(0,136,255,.12); --accent-glow:rgba(0,136,255,.32);
  --red:#FF383C; --red-t:rgba(255,56,60,.12); --red-ink:#D70015;
  --green:#34C759; --green-t:rgba(52,199,89,.16); --green-ink:#1F8A3B;
  /* macro colours: data only */
  --kcal:#0088FF; --pro:#6155F5; --fat:#FFCC00; --carb:#34C759;
  --kcal-t:#006FD6; --pro-t:#4B3FE0; --fat-t:#9A7400; --carb-t:#1F8A3B;
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display",system-ui,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --rounded:ui-rounded,"SF Pro Rounded",-apple-system,BlinkMacSystemFont,system-ui,sans-serif;
  /* Liquid Glass. Regular glass adapts to what is behind it and stays legible; it is only used
     for the navigation layer that floats above the content (bars, buttons, menus, sheets). */
  --glass:rgba(255,255,255,.52);
  --glass-thick:rgba(255,255,255,.76);
  --glass-fx:blur(12px) saturate(190%) brightness(1.04);
  --glass-shadow:0 8px 30px rgba(0,0,0,.11),0 1px 4px rgba(0,0,0,.05);
  --glass-edge:inset 0 0 0 .5px rgba(0,0,0,.06),inset 0 1px 1px rgba(255,255,255,.8),inset 0 0 18px rgba(255,255,255,.3);
  /* motion: the same springs as SwiftUI .bouncy, .smooth and .snappy */
  --spring:cubic-bezier(.34,1.4,.64,1); --smooth:cubic-bezier(.22,1,.36,1); --snappy:cubic-bezier(.3,1.25,.6,1);
  --out:cubic-bezier(.22,1,.36,1); --io:cubic-bezier(.65,0,.35,1);
  --r-card:26px;
  color-scheme:light;
}
@supports (transition-timing-function:linear(0,1)){:root{
  --spring:linear(0,0.042,0.145,0.277,0.418,0.554,0.675,0.778,0.861,0.925,0.971,1.003,1.023,1.034,1.038,1.038,1.035,1.03,1.025,1.019,1.014,1.01,1.007,1.004,1.002,1,0.999,0.999,0.999,0.999,0.999,0.999,1);
  --smooth:linear(0,0.041,0.137,0.257,0.382,0.5,0.606,0.696,0.771,0.831,0.879,0.915,0.942,0.962,0.977,0.987,0.994,0.998,1.001,1.002,1.003,1.003,1.003,1.003,1.002,1.002,1.002,1.001,1);
  --snappy:linear(0,0.068,0.217,0.39,0.554,0.694,0.803,0.884,0.94,0.976,0.998,1.01,1.014,1.015,1.014,1.011,1.009,1.006,1.004,1.003,1.001,1.001,1,1,1)}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%;background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--ink);font:400 17px/1.35 var(--font);-webkit-font-smoothing:antialiased;overscroll-behavior-y:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:inherit;-webkit-user-select:none;user-select:none}
input,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:12px}
[hidden]{display:none!important}
svg{display:block}
.app{max-width:560px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 52px) 16px calc(150px + env(safe-area-inset-bottom))}

/* ---------- Liquid Glass material ---------- */
/* Without backdrop-filter the material falls back to a frosted solid. */
.glass{position:relative;isolation:isolate;background:rgba(249,249,251,.96);box-shadow:var(--glass-shadow),var(--glass-edge)}
@supports ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){
  .glass{background:var(--glass);-webkit-backdrop-filter:var(--glass-fx);backdrop-filter:var(--glass-fx)}
  .toast.glass,.alert.glass{background:var(--glass-thick)}
  /* large glass is thicker and more opaque than small glass */
  .menu.glass{background:rgba(255,255,255,.8);-webkit-backdrop-filter:blur(24px) saturate(190%);backdrop-filter:blur(24px) saturate(190%)}
}
/* light that reacts to touch: a glow spreads from the point of contact (--px, --py) */
.btn,.qchip,.tbtn,.closeb,.accessory .tb{position:relative;isolation:isolate}
.btn::before,.qchip::before,.tbtn::before,.closeb::before,.accessory .tb::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;z-index:-1;opacity:var(--lit);
  background:radial-gradient(90px circle at var(--px,50%) var(--py,50%),rgba(255,255,255,.75),rgba(255,255,255,0) 70%);transition:--lit .7s var(--out)}
/* specular highlight along the top, plus the same touch glow */
.glass::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;z-index:-1;opacity:1;
  background:radial-gradient(110px circle at var(--px,50%) var(--py,50%),rgba(255,255,255,calc(var(--lit) * .9)),rgba(255,255,255,0) 72%),
    linear-gradient(180deg,rgba(255,255,255,.55),rgba(255,255,255,.08) 46%,rgba(255,255,255,0) 60%,rgba(255,255,255,.18));
  transition:--lit .7s var(--out)}
.lit::before{--lit:1;transition-duration:.12s}
/* the rim: light caught by the curved edge, brightest top left and bottom right */
.glass::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;padding:1px;
  background:linear-gradient(150deg,rgba(255,255,255,1),rgba(255,255,255,.4) 20%,rgba(255,255,255,.06) 42%,rgba(255,255,255,.06) 62%,rgba(255,255,255,.45) 82%,rgba(255,255,255,.95));
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude}
/* the lens: what a control turns into while you touch it */
.tab-ind.lens,.seg.lens .seg-thumb,.switch:active input::after,.switch input:active::after{
  background:rgba(255,255,255,.16);
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.95),inset 0 2px 3px rgba(255,255,255,.95),inset 0 -3px 8px rgba(0,0,0,.06),0 8px 22px rgba(0,0,0,.14);
  -webkit-backdrop-filter:saturate(1.9) brightness(1.08) blur(.5px);backdrop-filter:saturate(1.9) brightness(1.08) blur(.5px)}
/* glass materialises: the lensing and blur ramp up while it grows into place; only what sits on it fades */
.glass{transition:background-color .35s var(--out),box-shadow .35s var(--out),-webkit-backdrop-filter .35s var(--out),backdrop-filter .35s var(--out),scale .6s var(--spring)}
.glass.ghost{scale:.6;background-color:rgba(255,255,255,0);box-shadow:none;-webkit-backdrop-filter:blur(0) saturate(100%);backdrop-filter:blur(0) saturate(100%);pointer-events:none}
.glass.ghost::before,.glass.ghost::after,.glass.ghost>*{opacity:0}
.glass::after,.glass>*{transition:opacity .25s var(--out)}
.mat{animation:mat .6s var(--spring) both}
.mat::before,.mat::after,.mat>*{animation:matIn .35s var(--out) both}
@keyframes mat{from{scale:.55;background-color:rgba(255,255,255,0);box-shadow:none;-webkit-backdrop-filter:blur(0) saturate(100%);backdrop-filter:blur(0) saturate(100%)}}
@keyframes matIn{from{opacity:0}}

/* ---------- type ---------- */
h1{font-size:34px;line-height:1.2;font-weight:700;margin:0 4px 10px;letter-spacing:.004em}
h2{font-size:22px;line-height:1.2;font-weight:700;letter-spacing:-.012em;margin:28px 4px 10px}
h3{font-size:13px;font-weight:600;color:var(--ink2);margin:20px 8px 8px}
p{margin:0 0 8px}
.num{font-family:var(--rounded);font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.muted{color:var(--ink2)}
.small{font-size:14px}
.right{text-align:right}
.row{display:flex;align-items:center;gap:10px}
.grow{flex:1;min-width:0}
.gap8{margin-top:8px}.gap16{margin-top:16px}
.why{font-size:15px;line-height:1.38;color:var(--ink2);margin:0 0 6px}
.note{font-size:13px;line-height:1.38;color:var(--ink2);margin:10px 4px 0}
.empty{padding:26px 8px;color:var(--ink2);text-align:center}
.empty .btn{margin-top:14px}
.link{color:var(--accent);font-size:15px;font-weight:600}

/* ---------- navigation bar: floating glass buttons, no background, scroll edge effect ---------- */
.navbar{position:fixed;top:0;left:0;right:0;z-index:19;padding-top:env(safe-area-inset-top);pointer-events:none}
.nb-row{max-width:560px;height:52px;margin:0 auto;padding:0 16px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px}
.nb-side{display:flex;align-items:center;gap:8px;min-width:0;pointer-events:auto}
.nb-side.r{justify-content:flex-end}
.nb-inner{display:flex;flex-direction:column;align-items:center;opacity:0;transform:translateY(8px);transition:opacity .25s var(--out),transform .4s var(--out)}
#nbtitle{font-size:17px;font-weight:600}
#nbsub{font-size:12px;color:var(--ink2);font-weight:500}
body.scrolled .nb-inner{opacity:1;transform:none}
h1.lt{transition:opacity .2s var(--out)}
body.scrolled h1.lt{opacity:0}
/* scroll edge effect: content softly blurs and fades as it passes under the bars */
.edge{position:fixed;left:0;right:0;z-index:18;pointer-events:none}
.edge.top{top:0;height:calc(env(safe-area-inset-top) + 82px);opacity:0;transition:opacity .3s var(--out);
  background:linear-gradient(rgba(242,242,247,.97),rgba(242,242,247,.9) 50%,rgba(242,242,247,0));
  -webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);-webkit-mask:linear-gradient(#000 58%,transparent);mask:linear-gradient(#000 58%,transparent)}
body.under .edge.top{opacity:1}
.edge.bottom{bottom:0;height:calc(env(safe-area-inset-bottom) + 96px);
  background:linear-gradient(rgba(242,242,247,0),rgba(242,242,247,.7) 62%,rgba(242,242,247,.9));
  -webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);-webkit-mask:linear-gradient(transparent,#000 45%);mask:linear-gradient(transparent,#000 45%)}
/* toolbar buttons: label colour, glass circles and capsules */
.tbtn{width:44px;height:44px;border-radius:22px;display:grid;place-items:center;color:var(--ink);transition:scale .55s var(--spring)}
.tbtn svg{width:21px;height:21px}
.tbtn.txt{width:auto;padding:0 17px;font-size:17px;font-weight:500}
.tgroup{display:flex;border-radius:22px}
.tbtn.lit{scale:1.12}
.tbtn.morphing,.tgroup.morphing{opacity:0;transition:opacity .12s}

/* ---------- week strip (content, so no glass) ---------- */
.wk-head{display:flex;align-items:center;gap:8px;margin:0 4px 4px}
.wk-head .m{font-size:15px;font-weight:600;color:var(--ink2);flex:1}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;margin:0 -4px 14px;padding:4px 0;touch-action:pan-y}
.wd{display:flex;flex-direction:column;align-items:center;gap:3px;padding:4px 0 3px;border-radius:18px;transition:transform .3s var(--spring)}
.wd .l{font-size:11.5px;font-weight:600;color:var(--ink2)}
.wd .n{font-family:var(--rounded);font-size:18px;font-weight:600;width:38px;height:38px;display:grid;place-items:center;border-radius:50%;transition:background .3s var(--out),color .3s var(--out),box-shadow .3s}
.wd.today .n{color:var(--accent)}
.wd.sel .n{background:var(--accent);color:#fff;box-shadow:0 4px 12px var(--accent-glow)}
.wd.sel.today .n{color:#fff}
.wd .dots{display:flex;gap:3px;height:5px}
.wd .dots b{width:5px;height:5px;border-radius:50%;background:var(--accent)}
.wd .dots b.f{background:var(--ink3)}
.icb{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;color:var(--accent);background:rgba(120,120,128,.12);transition:transform .3s var(--spring)}
.icb svg{width:18px;height:18px}

/* ---------- cards and rows (content layer: solid, never glass) ---------- */
.group{background:var(--card);border-radius:var(--r-card);overflow:hidden;margin:0 0 16px}
.group.pad{padding:18px 16px}
.group>.switch{margin-left:16px;padding:0 16px 0 0;border-top:.5px solid var(--sep)}
.group>.switch:first-child{border-top:0}
.group.pad>.switch{margin-left:0;padding:0;border-top:0}
.session .why{margin-top:14px}
.item{margin-left:16px;padding:10px 16px 10px 0;min-height:56px;display:flex;align-items:center;gap:10px}
.divider{height:.5px;background:var(--sep);margin:14px 0}

/* ---------- controls ---------- */
/* segmented control: a white thumb that lifts into a glass lens while touched, and can be dragged */
.seg{position:relative;display:flex;background:var(--fill);border-radius:99px;padding:3px;touch-action:pan-y;--i:0;--n:2}
.seg button{position:relative;z-index:1;flex:1 1 0;min-width:0;min-height:36px;border-radius:99px;font-weight:500;font-size:15px;text-align:center;transition:scale .45s var(--spring)}
.seg button[aria-pressed=true]{font-weight:600}
.seg button.mag{scale:1.08}
.seg-thumb{position:absolute;z-index:0;top:3px;bottom:3px;left:calc(3px + (100% - 6px) * var(--i) / var(--n));width:calc((100% - 6px) / var(--n));border-radius:99px;
  background:#fff;box-shadow:0 3px 8px rgba(0,0,0,.12),0 0 0 .5px rgba(0,0,0,.04);
  transition:left .55s var(--spring),scale .5s var(--spring),background .2s,box-shadow .2s}
.seg.lens .seg-thumb{scale:1.1 1.32}
.seg.drag .seg-thumb{transition:scale .5s var(--spring),background .2s,box-shadow .2s}
/* switch: iOS 26 proportions; the knob turns into a lens when pressed */
.switch{display:flex;flex-direction:row-reverse;justify-content:space-between;align-items:center;gap:12px;min-height:52px;font-size:17px}
.switch input{appearance:none;-webkit-appearance:none;margin:0;width:64px;height:28px;border-radius:99px;background:rgba(120,120,128,.16);position:relative;flex:none;cursor:pointer;transition:background .3s var(--out)}
.switch input::after{content:"";position:absolute;top:2px;left:2px;width:38px;height:24px;border-radius:99px;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.14),0 0 0 .5px rgba(0,0,0,.04);
  transition:translate .5s var(--spring),scale .45s var(--spring),background .2s,box-shadow .2s}
.switch input:checked{background:var(--accent)}
.switch input:checked::after{translate:22px 0}
.switch:active input::after,.switch input:active::after{scale:1.3 1.55}
/* buttons: prominent glass (accent) and regular glass (tinted) */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:50px;padding:0 22px;border-radius:99px;font-weight:600;font-size:17px;color:#fff;
  background:var(--accent) linear-gradient(180deg,rgba(255,255,255,.2),rgba(255,255,255,0) 55%);
  box-shadow:inset 0 0 0 .5px rgba(255,255,255,.35),inset 0 1px 1px rgba(255,255,255,.45),0 6px 16px var(--accent-glow);transition:scale .55s var(--spring),background-color .15s}
.btn.tinted{color:var(--accent);background:rgba(255,255,255,.72) linear-gradient(180deg,rgba(255,255,255,.7),rgba(255,255,255,0) 60%);
  box-shadow:inset 0 0 0 .5px rgba(0,0,0,.06),inset 0 1px 1px #fff,0 2px 8px rgba(0,0,0,.08)}
.group .btn.tinted,.sheet .btn.tinted{background-color:var(--fill2)}
.btn.plain{background:transparent;color:var(--accent);box-shadow:none}
.btn.danger{color:var(--red-ink);background:var(--red-t);box-shadow:inset 0 0 0 .5px rgba(255,56,60,.12)}
.btn.block{display:flex;width:100%}
.btn.small{min-height:38px;padding:0 16px;font-size:15px}
.btn.lit{scale:1.06}
.btn.block.lit{scale:1.025}
.chip{display:inline-flex;align-items:center;gap:4px;padding:4px 11px;border-radius:99px;font-size:13px;font-weight:600;background:var(--fill);color:var(--ink2);white-space:nowrap}
.chip svg{width:13px;height:13px}
.chip.go{background:var(--accent);color:#fff}
.chip.low{background:var(--red-t);color:var(--red-ink)}
.chip.new,.chip.part{background:var(--accent-t);color:var(--accent)}
.chip.done{background:var(--green-t);color:var(--green-ink)}
.tag{display:block;font-size:13px;font-weight:500;color:var(--accent);margin:2px 0 0}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.hscroll{display:flex;gap:8px;overflow-x:auto;margin:10px -16px 0;padding:4px 16px 10px;scrollbar-width:none;scroll-snap-type:x proximity}
.hscroll::-webkit-scrollbar{display:none}
.hscroll .qchip{flex:none;scroll-snap-align:start}
.qchip{min-height:44px;padding:0 17px;border-radius:99px;font-weight:600;font-size:15px;
  background:rgba(255,255,255,.8) linear-gradient(180deg,#fff,rgba(255,255,255,0) 70%);
  box-shadow:inset 0 0 0 .5px rgba(0,0,0,.05),inset 0 1px 1px #fff,0 2px 8px rgba(0,0,0,.07);transition:scale .55s var(--spring),background-color .2s}
.qchip.lit{scale:1.07}
.qchip.on{background-color:var(--accent);color:#fff}
.gaps .qchip{background:var(--accent-t);color:var(--accent);box-shadow:inset 0 0 0 .5px rgba(0,136,255,.14);text-align:left;padding:9px 16px}
.gaps .qchip small{display:block;font-size:12.5px;font-weight:500;opacity:.8}

/* press feedback for content, like the UIKit highlight */
.capsule:active,.icb:active,.wd:active,.check:active,.drop:active{transform:scale(.92)}
.ex-head:active,.food:active,.entry:active,.addline:active,summary:active{background:rgba(120,120,128,.08)}

/* ---------- session card ---------- */
.session .top{display:flex;gap:14px;align-items:center}
.sring{position:relative;flex:none;width:64px;height:64px}
.sring .lbl{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--rounded);font-weight:700;font-size:15px}
.session-title{font-size:20px;font-weight:700;line-height:1.2;letter-spacing:-.01em}
.session .meta{font-size:14px;color:var(--ink2);margin-top:2px}
.collapse{display:grid;grid-template-rows:0fr;transition:grid-template-rows .4s var(--smooth)}
.collapse>div{overflow:hidden}
.collapse.open{grid-template-rows:1fr}

/* ---------- lifts ---------- */
.ex{margin-left:16px;border-top:.5px solid var(--sep)}
.ex:first-child{border-top:0}
.ex-head{display:grid;grid-template-columns:66px 1fr auto;gap:12px;align-items:center;width:calc(100% + 16px);margin-left:-16px;padding:14px 16px 14px 16px;min-height:78px;transition:background .2s}
.wt{font-size:34px;line-height:.95;text-align:right}
.wt small{display:block;font-family:var(--font);font-weight:500;font-size:12px;color:var(--ink2);margin-top:4px;letter-spacing:0}
.ex-name{font-weight:600;font-size:17px;line-height:1.2}
.ex-sub{font-size:14px;line-height:1.3;color:var(--ink2);margin-top:3px}
.sets-wrap{display:grid;grid-template-rows:0fr;transition:grid-template-rows .45s var(--smooth)}
.sets-wrap>div{overflow:hidden;min-height:0}
.sets-wrap.open{grid-template-rows:1fr}
.sets-inner{padding:0 16px 16px 0;opacity:0;transform:translateY(-6px);transition:opacity .3s var(--out) .05s,transform .4s var(--out) .05s}
.sets-wrap.open .sets-inner{opacity:1;transform:none}
.setrow,.setlab{display:grid;grid-template-columns:24px 1fr 1fr 44px;gap:8px;align-items:center}
.setrow{margin-bottom:8px}
.setrow .n{color:var(--ink2);font-size:15px;text-align:center;font-family:var(--rounded);font-weight:600}
.setrow input,.field{width:100%;height:46px;border-radius:14px;border:0;background:var(--fill2);padding:0 10px;font-family:var(--rounded);font-size:20px;font-weight:600;text-align:center;letter-spacing:-.01em;transition:background .25s,box-shadow .25s}
.setrow input::placeholder,.field::placeholder{color:var(--ink3);font-weight:500}
.setrow input:focus,.field:focus{outline:0;background:var(--card);box-shadow:0 0 0 2px var(--accent)}
.setrow.on input{background:var(--green-t)}
.check{width:40px;height:40px;border-radius:50%;justify-self:center;display:grid;place-items:center;color:transparent;box-shadow:inset 0 0 0 2px var(--ink3);transition:background .25s var(--out),box-shadow .25s,transform .3s var(--spring)}
.check svg{width:20px;height:20px}
.check.on{background:var(--green);color:#fff;box-shadow:none}
.check.pop{animation:pop .5s var(--spring)}
.setlab{font-size:12px;color:var(--ink2);margin-bottom:4px;text-align:center}
.cue{font-size:14px;color:var(--ink2);margin:0 0 12px}
.ex.flash{animation:flash 1.1s var(--out)}

/* ---------- eat ---------- */
.sum-top{display:flex;align-items:center;gap:16px}
.rings{flex:none}
.rings .arc{transition:stroke-dashoffset .9s var(--out)}
.rings.anim .arc{animation:ringIn 1.1s var(--out) both}
.rings.anim .arc:nth-of-type(2){animation-delay:.08s}
.hero .num{font-size:46px;line-height:1}
.hl{font-size:15px;font-weight:600;color:var(--ink2);margin-top:2px}
.hp{font-size:14px;font-weight:600;margin-top:6px}
.macro{display:grid;grid-template-columns:84px 1fr 104px;gap:10px;align-items:center;margin:13px 0 0}
.macro .lab{font-weight:600;font-size:15px;display:flex;align-items:center;gap:7px}
.macro .lab i{width:10px;height:10px;border-radius:50%;background:var(--c);flex:none}
.bar{height:10px;border-radius:99px;background:var(--fill);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:99px;background:var(--c);transition:width .8s var(--out)}
.bars.anim .bar>i{animation:barIn 1s var(--out) both}
.bar.over>i{background:var(--red)}
.macro .val{text-align:right;font-size:22px;line-height:1}
.macro .val .of{font-family:var(--font);font-weight:500;font-size:13px;color:var(--ink2);letter-spacing:0}

.caps{display:flex;flex-wrap:wrap;gap:6px;margin:16px 0 0}
.cap{font-size:13px;font-weight:600;padding:5px 11px;border-radius:99px;background:var(--fill2);color:var(--ink2);transition:background .3s,color .3s}
.cap.full{background:var(--accent-t);color:var(--accent)}

.drops{display:flex;justify-content:space-between;padding:4px 16px 14px}

.slothead .nm{font-weight:700;font-size:17px}

.swipe{position:relative;margin-left:16px;border-top:.5px solid var(--sep);overflow:hidden;transition:height .3s var(--out),opacity .3s}

.entry{width:100%;padding:10px 16px 10px 0;min-height:56px}
.entry .nm{font-size:16px;font-weight:500;line-height:1.2}
.entry .q{font-size:13px;color:var(--ink2)}
.entry .t{text-align:right;font-size:14px;font-variant-numeric:tabular-nums;font-family:var(--rounded);font-weight:600}
.addline{display:flex;align-items:center;gap:10px;min-height:52px;width:calc(100% - 16px);margin-left:16px;padding:0 16px 0 0;border-top:.5px solid var(--sep);color:var(--accent);font-weight:600;font-size:16px}
.addline .pl{display:grid;place-items:center;width:24px;height:24px;border-radius:50%;background:var(--accent);color:#fff}
.addline .pl svg{width:14px;height:14px}

/* ---------- progress ---------- */
.chart{width:100%;height:auto}
.chart text{font-family:var(--font);fill:var(--ink2);font-size:10px}
.chart.anim rect.b{transform-box:fill-box;transform-origin:bottom;animation:grow .7s var(--out) both}
.lift{display:grid;grid-template-columns:1fr auto 84px;gap:12px;align-items:center;margin-left:16px;padding:12px 16px 12px 0;border-top:.5px solid var(--sep)}
.lift:first-child{border-top:0}
.lift .num{font-size:24px}
.stat{display:flex;justify-content:space-between;gap:12px}
.stat .num{font-size:32px;line-height:1}

/* ---------- setup ---------- */
details{background:var(--card);border-radius:var(--r-card);margin:0 0 12px;overflow:hidden}
summary{list-style:none;cursor:pointer;min-height:58px;padding:0 18px;display:flex;align-items:center;gap:12px;font-weight:600;font-size:17px;transition:background .2s}
summary::-webkit-details-marker{display:none}
summary .ico{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;color:#fff;flex:none}
summary .ico svg{width:18px;height:18px}
summary .t{flex:1}
summary::after{content:"";width:9px;height:9px;border-right:2.5px solid var(--ink3);border-bottom:2.5px solid var(--ink3);transform:rotate(-45deg);transition:transform .4s var(--spring);margin-right:3px}
details[open] summary::after{transform:rotate(45deg)}
details[open] .form{animation:fadeUp .4s var(--out)}
.form{display:grid;gap:12px;padding:2px 18px 18px}
.fl{display:grid;grid-template-columns:1fr 96px;gap:10px;align-items:center;font-size:16px}
.fl .field{height:42px;font-size:17px}
.fl.sel{grid-template-columns:1fr 190px}
.fl select{height:42px;border-radius:12px;border:0;background:var(--fill2);padding:0 10px;font-size:16px}
.exset{display:grid;grid-template-columns:1fr 54px 54px 54px 54px;gap:6px;align-items:center;font-size:14px}
.exset .field{height:38px;font-size:15px;padding:0 4px}
.exset.h{font-size:12px;color:var(--ink2);text-align:center}

/* ---------- tab bar: floating glass capsule, liquid selection, minimises on scroll ---------- */
.dock{position:fixed;z-index:20;left:max(21px,calc(50% - 200px));right:max(21px,calc(50% - 200px));bottom:max(12px,calc(env(safe-area-inset-bottom) - 10px));height:62px;pointer-events:none}
.tabbar{position:absolute;left:0;bottom:0;width:100%;height:62px;padding:4px;border-radius:31px;display:flex;pointer-events:auto;touch-action:none;
  transition:width .6s var(--spring),height .6s var(--spring),border-radius .6s var(--spring)}
.tab{position:relative;z-index:1;flex:1 1 0;min-width:0;overflow:hidden;border-radius:27px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;
  font-size:10px;font-weight:600;letter-spacing:.01em;color:var(--ink);white-space:nowrap;transition:color .25s,flex-grow .6s var(--spring),opacity .25s}
.tab svg{width:28px;height:28px;flex:none;fill:currentColor;transition:scale .45s var(--spring)}

  background:rgba(120,120,128,.14);transition:background .25s,box-shadow .25s,opacity .3s,scale .5s var(--spring)}
.tab-ind.lens{scale:1.12 1.24}
body.min .tabbar{width:52px;height:52px;border-radius:26px}
body.min .tab:not([aria-current=page]){flex-grow:0;opacity:0;pointer-events:none}
body.min .tab .tl{opacity:0;position:absolute}
body.min .tab-ind{opacity:0}
/* the tab bar accessory (rest timer), like the Music mini player; moves inline when the bar minimises */
.accessory{position:absolute;left:0;right:0;bottom:70px;height:52px;border-radius:26px;display:flex;align-items:center;gap:10px;padding:0 7px 0 9px;pointer-events:auto;
  transition:left .6s var(--spring),bottom .6s var(--spring),scale .6s var(--spring),background-color .35s var(--out),box-shadow .35s var(--out),-webkit-backdrop-filter .35s var(--out),backdrop-filter .35s var(--out)}
body.min .accessory{left:60px;bottom:0}
.tring{width:34px;height:34px;flex:none}
.tring circle{fill:none;stroke-width:4}
.tring .trk{stroke:rgba(120,120,128,.2)}
.tring .prg{stroke:var(--accent);stroke-linecap:round;transform:rotate(-90deg);transform-origin:center;transition:stroke-dashoffset .3s linear}
.accessory .tt{display:flex;flex-direction:column;line-height:1.05;flex:1;min-width:0}
.accessory .tl{font-size:11px;font-weight:600;color:var(--ink2)}
.accessory .tv{font-size:21px}
.accessory .tb{white-space:nowrap;min-height:38px;padding:0 14px;border-radius:99px;background:rgba(120,120,128,.14);font-weight:600;font-size:14px;transition:scale .5s var(--spring)}
.accessory .tb.lit{scale:1.1}
.accessory.done .prg{stroke:var(--green)}
.accessory.done{animation:nudge .6s var(--spring)}

/* ---------- menus morph out of the button that opens them ---------- */
.menuscrim{position:fixed;inset:0;z-index:34}
.menu{position:fixed;z-index:35;width:max-content;min-width:230px;max-width:min(310px,calc(100vw - 32px));max-height:72vh;overflow:auto;border-radius:28px;padding:8px 0;overscroll-behavior:contain}
.menu .mh{font-size:13px;font-weight:500;color:var(--ink2);padding:8px 20px 4px}
.menu .mi{display:flex;align-items:center;gap:12px;width:calc(100% - 12px);margin:0 6px;min-height:46px;padding:0 14px;border-radius:18px;font-size:17px;text-align:left;transition:background .15s}
.menu .mi:active{background:rgba(120,120,128,.16)}
.menu .mic{width:22px;flex:none;display:grid;place-items:center}
.menu .mic svg{width:19px;height:19px}
.menu .msep{height:.5px;background:var(--sep);margin:6px 20px}

/* ---------- sheets: inset glass at partial height, edge to edge and opaque when tall ---------- */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.2);z-index:30;opacity:0;transition:opacity .4s var(--out)}
.scrim.open{opacity:1}
.sheet{position:fixed;left:8px;right:8px;bottom:8px;margin:0 auto;max-width:544px;max-height:calc(100% - env(safe-area-inset-top) - 24px);overflow:auto;border-radius:42px;
  padding:0 16px max(20px,env(safe-area-inset-bottom));z-index:31;overscroll-behavior:contain;transform:translateY(calc(100% + 40px));
  transition:transform .6s var(--smooth),left .45s var(--smooth),right .45s var(--smooth),bottom .45s var(--smooth),border-radius .45s var(--smooth),max-width .45s var(--smooth)}
.sheet.open{transform:none}
.sheet.dragging{transition:none}
.sheet.full{left:0;right:0;bottom:0;max-width:560px;border-radius:38px 38px 0 0}
@supports ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){
  .sheet.glass{background:rgba(255,255,255,.62);-webkit-backdrop-filter:blur(26px) saturate(190%);backdrop-filter:blur(26px) saturate(190%)}
  .sheet.glass.full{background:rgba(242,242,247,.97)}}
.sheet-head{position:sticky;top:0;z-index:2;touch-action:none;cursor:grab;margin:0 -16px;padding:7px 14px 10px}
.sheet.full .sheet-head{background:linear-gradient(rgba(242,242,247,.97) 72%,rgba(242,242,247,0))}
.sheet-bar{display:grid;grid-template-columns:44px 1fr 44px;align-items:center;gap:8px}
.sheet-bar h2{margin:0;font-size:17px;font-weight:600;letter-spacing:0;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.grab{width:36px;height:5px;border-radius:9px;background:rgba(60,60,67,.3);margin:0 auto 7px}
.closeb{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;color:var(--ink);
  background:rgba(255,255,255,.6) linear-gradient(180deg,rgba(255,255,255,.8),rgba(255,255,255,0) 70%);
  box-shadow:inset 0 0 0 .5px rgba(0,0,0,.07),inset 0 1px 1px #fff,0 2px 8px rgba(0,0,0,.08);transition:scale .5s var(--spring)}
.closeb svg{width:16px;height:16px}
.closeb.lit{scale:1.12}
.search{width:100%;height:44px;border-radius:22px;border:0;background:var(--fill);padding:0 14px 0 38px;font-size:17px;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='17' height='17' viewBox='0 0 24 24' fill='none' stroke='%236C6C70' stroke-width='2.6' stroke-linecap='round'><circle cx='11' cy='11' r='7'/><path d='M20 20l-3.5-3.5'/></svg>");background-repeat:no-repeat;background-position:13px center}
.search:focus{outline:0;box-shadow:0 0 0 2px var(--accent)}
.food{display:grid;grid-template-columns:1fr auto;gap:8px;width:calc(100% - 16px);margin-left:16px;padding:11px 16px 11px 0;border-top:.5px solid var(--sep);min-height:56px;align-items:center;transition:background .2s}
.group>.food:first-child{border-top:0}
.food .nm{font-weight:500}
.food .m{font-size:13px;color:var(--ink2)}
.food .add{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--accent-t);color:var(--accent)}
.food .add svg{width:14px;height:14px}
.qty{display:grid;grid-template-columns:52px 1fr 52px;gap:10px;align-items:center;margin:12px 0}
.qty button{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;background:var(--accent-t);color:var(--accent);transition:transform .3s var(--spring)}
.qty button svg{width:20px;height:20px}
.qty button:active{transform:scale(.88)}
.qty .field{height:56px;font-size:28px;background:var(--card)}
.preview{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:6px 0 14px;text-align:center;background:var(--card);border-radius:24px;padding:14px 6px}
.preview .num{font-size:26px;line-height:1}
.preview small{display:block;font-size:12px;color:var(--ink2);font-weight:600;margin-top:3px}
body.lock{overflow:hidden}

/* ---------- alert ---------- */
.alertwrap{position:fixed;inset:0;z-index:50;display:grid;place-items:center;padding:24px;background:rgba(0,0,0,0);transition:background .3s var(--out)}
.alertwrap.open{background:rgba(0,0,0,.2)}
.alert{width:min(300px,100%);border-radius:34px;padding:22px 18px 18px}
.alert h4{font-size:17px;font-weight:700;margin:0 4px 6px}
.alert p{font-size:15px;line-height:1.35;margin:0 4px 18px}
.alert .row .btn{flex:1;min-height:48px;padding:0 12px}

/* ---------- toast (glass banner from the top) ---------- */
.toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 8px);z-index:40;display:flex;align-items:center;gap:8px;max-width:92vw;white-space:nowrap;padding:11px 18px 11px 12px;border-radius:99px;font-weight:600;font-size:15px;
  translate:-50% 0;transition:translate .6s var(--spring),scale .6s var(--spring),background-color .35s var(--out),box-shadow .35s var(--out),-webkit-backdrop-filter .35s var(--out),backdrop-filter .35s var(--out)}
.toast.ghost{translate:-50% -16px}
.toast>span:not(.ok){overflow:hidden;text-overflow:ellipsis}
.toast .ok{width:22px;height:22px;border-radius:50%;background:var(--green);color:#fff;display:grid;place-items:center;flex:none}
.toast .ok svg{width:13px;height:13px}

/* ---------- page transitions ---------- */
/* Only the content slides. The bars stay live in the root layer: naming them would make them a backdrop
   root, and their glass would stop seeing (and blurring) the page behind it. */
#app{view-transition-name:main}
::view-transition-old(root){animation:none;opacity:0}
::view-transition-new(root){animation:none}
::view-transition-old(main){animation:vtOut .22s var(--io) both}
::view-transition-new(main){animation:vtIn .4s var(--out) both}
@keyframes vtOut{to{opacity:0;transform:translateX(calc(var(--vt-dir,1) * -22px))}}
@keyframes vtIn{from{opacity:0;transform:translateX(calc(var(--vt-dir,1) * 26px))}}
.app.enter{animation:vtIn .4s var(--out) both}

/* ---------- keyframes ---------- */
@keyframes pop{0%{transform:scale(.55)}55%{transform:scale(1.16)}100%{transform:scale(1)}}
@keyframes flash{0%{background-color:rgba(0,136,255,.14)}100%{background-color:transparent}}
@keyframes flashFg{0%{background-color:#E3F1FF}100%{background-color:#fff}}
@keyframes rowIn{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}
@keyframes ringIn{from{stroke-dashoffset:var(--c)}}
@keyframes barIn{from{width:0}}
@keyframes grow{from{transform:scaleY(0)}}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes nudge{0%{scale:1}40%{scale:1.06}100%{scale:1}}

/* ---------- accessibility settings ---------- */
@media (prefers-reduced-transparency:reduce){
  .glass,.sheet.glass,.menu.glass{background:rgba(246,246,248,.99)!important;-webkit-backdrop-filter:none!important;backdrop-filter:none!important}
  .edge{-webkit-backdrop-filter:none;backdrop-filter:none}
}
@media (prefers-contrast:more){
  :root{--accent:#1E6EF4;--kcal:#1E6EF4}
  .glass{background:rgba(255,255,255,.97)!important;box-shadow:0 0 0 1px rgba(0,0,0,.45),var(--glass-shadow)!important}
  .glass::before,.glass::after{display:none}
  .tab-ind{background:rgba(0,0,0,.12)}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
  ::view-transition-old(main),::view-transition-new(main){animation:none!important}
}
</style>

<script>
'use strict';
/* =====================================================================
   CONFIG. Edit this block (or ask Claude to) to change foods, lifts,
   sessions and defaults. Your logs live in the browser and are not
   touched when this changes.
   ===================================================================== */
const APP_VERSION = '3.0';
const LS_KEY = 'coach-v1';

const DEFAULT_TARGETS = {
  training: { kcal: 2250, p: 160, f: 70, c: 235 },   // f = ceiling, p = floor
  rest:     { kcal: 2000, p: 160, f: 65, c: 175 }
};
const DEFAULT_CAPS = { egg: 3, whey: 1, quark: 250, chicken: 150, pudding: 2 };  // per day; pudding per 7 days
const CAP_LABEL = { egg: 'Eggs', whey: 'Whey', quark: 'Quark', chicken: 'Chicken', pudding: 'Pudding' };
const CAP_UNIT  = { egg: '', whey: '', quark: ' g', chicken: ' g', pudding: ' this week' };

/* ---------- Lifts ----------
   kind: compound | iso. low/high = rep range, sets = target sets, inc = next jump.
   prio: lower number survives time trimming first. ord: order on the day.

  return Math.round((Date.UTC(B.getFullYear(),B.getMonth(),B.getDate()) - Date.UTC(A.getFullYear(),A.getMonth(),A.getDate())) / 864e5); };

  }));

function migrate(s){
  const d = defaultSettings();
  s.settings = Object.assign(d, s.settings || {});
  s.settings.targets  = Object.assign(deepClone(DEFAULT_TARGETS), s.settings.targets || {});
  s.settings.caps     = Object.assign(deepClone(DEFAULT_CAPS), s.settings.caps || {});
  s.settings.schedule = Object.assign(deepClone(DEFAULT_SCHEDULE), s.settings.schedule || {});
  ['days','workouts','dismissed','water'].forEach(k => { if (!s[k]) s[k] = {}; });
  if (!s.foods) s.foods = [];
  if (!s.waist) s.waist = [];
  return s;
}

/* ---------- exercise config (base + your overrides) ---------- */
function cfg(id){ return Object.assign({}, EX[id], (S.settings.exCfg||{})[id] || {}); }

/* ---------- workouts ---------- */
const setsDone  = (wk, id) => ((wk && wk.ex && wk.ex[id]) || []).filter(s => +s.r > 0);
const loggedIds = wk => wk && wk.ex ? Object.keys(wk.ex).filter(id => EX[id] && setsDone(wk,id).length) : [];
const workoutDates = () => Object.keys(S.workouts).sort();

function lastTrained(muscle, before){          // most recent date (< before) with any logged set for this muscle
  const ds = workoutDates().filter(d => d < before).reverse();
  for (const d of ds) for (const id of loggedIds(S.workouts[d])) if (EX[id].muscle === muscle) return d;
  return null;
}
function loggedSince(id, from, to){            // logged on or after `from`, before `to`
  return workoutDates().some(d => d >= from && d < to && setsDone(S.workouts[d], id).length > 0);
}
function lowerRecently(date, days=5){
  return workoutDates().some(d => d < date && diffDays(d, date) <= days &&
    loggedIds(S.workouts[d]).filter(id => LOWER.includes(EX[id].muscle)).length >= 2);
}
function liftHistory(id, before){                  // sessions (newest first) with sets for this lift, dates < before
  return workoutDates().filter(d => d < before).reverse()
    .map(d => ({ date:d, sets:setsDone(S.workouts[d], id).map(s => ({w:+s.w||0, r:+s.r})) }))
    .filter(h => h.sets.length);
}

/* ---------- progression (double progression) ----------
   All sets reached the top of the rep range (and you did enough sets) -> add weight.
   Otherwise hold. Two sessions in a row under the bottom of the range -> go lighter.
   Gap rules: 5-14 days off = same weight, first set as a check; 15+ days = one step lighter. */
function suggest(id, date){
  const c = cfg(id), hist = liftHistory(id, date);
  if (!hist.length) {
    return { status:'new', w: c.start ?? null, sets:c.sets, low:c.low, high:c.high,
             text: c.start ? `Start around ${fmtW(c.start)} ${c.unit}. Log it to set a baseline.` : 'No baseline yet. Start light and log it.',
             last:'' };
  }
  const last = hist[0], W = Math.max(...last.sets.map(s => s.w));
  const lastTxt = last.sets.map(s => `${fmtW(s.w)}×${s.r}`).join(', ');
  const atW = last.sets.filter(s => s.w === W);
  const allClean = last.sets.length >= c.sets && last.sets.every(s => s.r >= c.high);
  let status, w, text;
  const prev = hist[1];
  const prevW = prev ? Math.max(...prev.sets.map(s => s.w)) : null;
  const failTwice = prev && prevW === W &&
    Math.max(...atW.map(s=>s.r)) < c.low && Math.max(...prev.sets.filter(s=>s.w===W).map(s=>s.r)) < c.low;
  if (failTwice) {
    status = 'low'; w = Math.max(0, r1(W - c.inc));
    text = `Go lighter: ${fmtW(w)} ${c.unit}. Two sessions under ${c.low} reps at ${fmtW(W)}.`;
  } else if (allClean) {
    status = 'go'; w = r1(W + c.inc);
    text = `Add weight: ${fmtW(w)} ${c.unit}, aim for ${c.sets}×${c.low}+.`;
  } else {
    status = 'hold'; w = W;
    text = `Hold ${fmtW(W)} ${c.unit}: ${c.sets} sets of ${c.high} before adding weight.`;
  }
  const lastAny = workoutDates().filter(d => d < date).pop();
  const gap = lastAny ? diffDays(lastAny, date) : 0;
  if (gap >= 15 && status !== 'low') { status = 'low'; w = Math.max(0, r1(w - c.inc));
    text = `Back after ${gap} days off: start at ${fmtW(w)} ${c.unit}, one step down.`; }
  else if (gap >= 5 && gap < 15) text += ` ${gap} days since your last workout: treat set 1 as a check.`;
  if (S.settings.returning && status !== 'low') { w = Math.max(0, r1(w - c.inc)); status = 'low';
    text = `Back after a break: ${fmtW(w)} ${c.unit} for set 1, add from set 2 if it feels easy.`; }
  return { status, w, sets:c.sets, low:c.low, high:c.high, text, last:lastTxt, lastDate:last.date, topW:W };
}

/* ---------- planner ----------
   Scheduled session for the day + everything still owed from the last 7 days
   (exercise by exercise), minus what needs recovery, trimmed to the time you have. */
const needGap = c => c.kind === 'compound' ? 2 : 1;      // days since the muscle was last trained

function computeOwed(date){
  const out = new Map();
  for (let k = 1; k <= 7; k++) {
    const d = addDays(date, -k);
    if (d < S.settings.planStart) continue;
    const t = S.settings.schedule[wdOf(d)];
    if (!t || !TEMPLATES[t] || S.dismissed[d]) continue;
    TEMPLATES[t].ex.forEach(id => {
      if (out.has(id) || !EX[id]) return;
      if (loggedSince(id, d, date)) return;
      out.set(id, { id, from:d, tid:t });
    });
  }
  return Array.from(out.values());
}
function minutesFor(id){ const c = cfg(id); return c.muscle === 'abs' ? ABS_MIN : (MINUTES[c.kind] || 8); }

function buildPlan(date, opts={}){
  const today = todayStr(), budget = opts.budget || S.settings.timeBudget;
  const wd = wdOf(date), why = [], deferred = [];
  const wk = S.workouts[date];
  let tid = opts.templateId !== undefined ? opts.templateId : S.settings.schedule[wd];
  if (S.dismissed[date] && opts.templateId === undefined) tid = null;
  const tpl = tid && TEMPLATES[tid] ? TEMPLATES[tid] : null;

  // past days: show what was logged, nothing else
  if (date < today) {
    const ids = new Set(loggedIds(wk).concat((wk && wk.added) || []));
    const items = Array.from(ids).sort((a,b) => EX[a].ord - EX[b].ord).map(id => ({ id, origin:'logged', sug: suggest(id, date) }));
    return { date, tid, title: items.length ? 'Logged workout' : 'No workout logged', why:[ items.length ? 'Editing a past day.' : 'Nothing was logged on this day.' ],
             items, deferred:[], minutes:0, budget, past:true, owed:[] };
  }

  const pool = new Map();
  if (tpl) { tpl.ex.forEach(id => pool.set(id, { id, from:date, origins:['today'], tid })); why.push(`${WD[wd]}: ${tpl.name} is scheduled.`); }
  else why.push(S.dismissed[date] ? `You skipped today's scheduled session.` : `${WD[wd]} is an off day in your split.`);

  let owed = [];
  if (date === today) {
    owed = computeOwed(date);
    const groups = {};
    owed.forEach(o => { const key = o.from + '|' + o.tid; (groups[key] = groups[key] || []).push(o); });
    owed.forEach(o => { if (pool.has(o.id)) pool.get(o.id).origins.push('carried'); else pool.set(o.id, { id:o.id, from:o.from, origins:['carried'], tid:o.tid }); });
    Object.keys(groups).sort().forEach(key => {
      const [d, t] = key.split('|');
      const names = groups[key].map(o => cfg(o.id).name.toLowerCase());
      why.push(`Carried over from ${WD[wdOf(d)]} (${TEMPLATES[t].name}, not logged): ${joinNames(names)}.`);
    });
  }

  // recovery and lower-body rules
  const kept = [];
  const rested = [], lowerWait = [];
  const lowerBlock = lowerRecently(date);
  pool.forEach(it => {
    const c = cfg(it.id);
    const ran = setsDone(wk, it.id).length > 0;          // already being logged today: never drop
    if (!ran) {
      const lt = lastTrained(c.muscle, date);
      if (lt && diffDays(lt, date) < needGap(c) && !opts.ignoreRecovery) { rested.push(it); deferred.push({ id:it.id, reason:`${MUSCLE_LABEL[c.muscle].toLowerCase()} trained ${diffDays(lt,date)===1?'yesterday':diffDays(lt,date)+' days ago'}` }); return; }
      if (LOWER.includes(c.muscle) && lowerBlock && !opts.ignoreRecovery) { lowerWait.push(it); deferred.push({ id:it.id, reason:'legs already trained this week' }); return; }
    }
    kept.push(it);
  });
  if (rested.length) why.push(`Held back for recovery: ${joinNames(rested.map(i => cfg(i.id).name.toLowerCase()))}.`);
  if (lowerWait.length) why.push(`Legs were trained in the last 5 days, so lower-body work waits.`);

  // time budget: compounds first, then by priority, older owed first
  const ranked = kept.slice().sort((a,b) => {
    const ca = cfg(a.id), cb = cfg(b.id);
    return (ca.kind==='compound'?0:1) - (cb.kind==='compound'?0:1) || ca.prio - cb.prio || (a.from < b.from ? -1 : 1);
  });
  let used = 0; const chosen = [], trimmed = [];
  ranked.forEach(it => {
    const m = minutesFor(it.id), forced = setsDone(wk, it.id).length > 0;
    if (forced || used + m <= budget || chosen.length < 3) { chosen.push(it); used += m; } else trimmed.push(it);
  });
  trimmed.forEach(it => deferred.push({ id:it.id, reason:`did not fit ${budget} min` }));
  if (trimmed.length) why.push(`To fit ${budget} minutes, these move to your next session: ${joinNames(trimmed.map(i => cfg(i.id).name.toLowerCase()))}. They stay on your list for 7 days.`);

  // anything added by hand or already logged today
  const present = new Set(chosen.map(i => i.id));
  const extra = new Set(((wk && wk.added) || []).concat(loggedIds(wk)));
  extra.forEach(id => { if (EX[id] && !present.has(id)) { chosen.push({ id, from:date, origins:['added'] }); present.add(id); } });

  chosen.sort((a,b) => cfg(a.id).ord - cfg(b.id).ord);
  const items = chosen.map(it => ({ id:it.id, origin: it.origins.includes('carried') ? 'carried' : it.origins.includes('added') ? 'added' : 'today', from:it.from, sug: suggest(it.id, date) }));

  let title;
  const carriedNames = Array.from(new Set(owed.map(o => TEMPLATES[o.tid].name)));
  if (tpl && owed.length && items.some(i => i.origin === 'carried')) title = `${tpl.name} plus carried work`;
  else if (tpl) title = tpl.name;
  else if (items.length && carriedNames.length) title = `Carried: ${joinNames(carriedNames)}`;
  else if (items.length) title = 'Workout';
  else title = 'Rest day';
  return { date, tid, title, why, items, deferred, minutes:used, budget, past:false, owed };
}
const getPlan = date => buildPlan(date, { templateId: ui.forceTpl[date] });

/* ---------- foods and macros ---------- */
const allFoods = () => FOODS.concat(S.foods || []);
const foodById = id => allFoods().find(f => f.id === id);
const macrosFor = (food, qty) => { const k = food.unit === 'g' ? qty/100 : qty; return { kcal:food.kcal*k, p:food.p*k, f:food.f*k, c:food.c*k }; };
const perUnit = food => { const k = food.unit === 'g' ? 1/100 : 1; return { kcal:food.kcal*k, p:food.p*k, f:food.f*k, c:food.c*k }; };
function makeEntry(food, qty, slot){
  const m = macrosFor(food, qty);
  return { id:uid(), food:food.id, name:food.name, unit:food.unit, qty:+qty, slot, kcal:m.kcal, p:m.p, f:m.f, c:m.c,
           k:perUnit(food), cap:food.cap||null, capQty: food.cap ? qty*(food.capMul||1) : 0 };
}
function addEntry(date, food, qty, slot){
  const e = makeEntry(food, qty, slot);
  (S.days[date] = S.days[date] || { entries:[] }).entries.push(e);
  saveState(); return e;
}
const dayEntries = date => (S.days[date] && S.days[date].entries) || [];
const sumMacros = list => list.reduce((a,e) => ({ kcal:a.kcal+e.kcal, p:a.p+e.p, f:a.f+e.f, c:a.c+e.c }), { kcal:0, p:0, f:0, c:0 });
function dayType(date){
  const d = S.days[date]; if (d && d.type) return d.type;
  if (loggedIds(S.workouts[date]).length) return 'training';
  if (date < todayStr()) return 'rest';
  return buildPlan(date, { templateId: ui.forceTpl[date] }).items.length ? 'training' : 'rest';
}
const dayTarget = date => S.settings.targets[dayType(date)];
function capUsage(date){
  const u = { egg:0, whey:0, quark:0, chicken:0, pudding:0 };
  dayEntries(date).forEach(e => { if (e.cap && e.cap !== 'pudding') u[e.cap] += e.capQty; });
  for (let i = 0; i < 7; i++) dayEntries(addDays(date, -i)).forEach(e => { if (e.cap === 'pudding') u.pudding += e.capQty; });
  return u;
}
function qtyText(e){
  if (e.unit === 'day') return 'imported total';
  if (e.unit === 'g') return `${fmtW(e.qty)} g`;
  return `${fmtW(e.qty)} × ${e.unit}`;
}

/* what would close the gap, using only your foods and respecting your caps */
function suggestGap(date){
  const T = dayTarget(date), cur = sumMacros(dayEntries(date)), used = capUsage(date), caps = S.settings.caps;
  let R = { kcal:T.kcal-cur.kcal, p:T.p-cur.p, c:T.c-cur.c }, fatRoom = T.f - cur.f;
  if (R.kcal < 100 && R.p < 8) return { picks:[], note:'On target. Nothing to add.' };
  const room = key => Math.max(0, caps[key] - used[key]);
  const cands = [];
  const add = (id, qty) => { const f = foodById(id); if (f && qty > 0) cands.push({ food:f, qty, m:macrosFor(f, qty) }); };
  if (room('quark') >= 100) add('quark', Math.min(250, room('quark')));
  if (room('whey') >= 1) add('whey', 1);
  if (room('chicken') >= 50) add('chicken_c', Math.min(150, room('chicken')));
  if (room('egg') >= 1) add('egg', Math.min(3, room('egg')));
  if (room('pudding') >= 1) add('pudding', 1);
  [['tuna',100],['chana',200],['rice',150],['rice',250],['banana',1],['grapes',150],['kaki',100],['mango',100],['ricecakes',100],
   ['bread',2],['wrap',1],['pasta',200],['potato',1],['oil_tsp',2],['ghee_tbsp',1],['peanutbutter',20],['oats',40]].forEach(([i,q]) => add(i,q));
  const picks = [], taken = new Set();
  for (let round = 0; round < 3; round++) {
    let best = null;
    cands.forEach(cd => {
      if (taken.has(cd.food.id)) return;
      const m = cd.m, rp = Math.max(0,R.p), rk = Math.max(0,R.kcal), rc = Math.max(0,R.c);
      const gain = 3*(rp - Math.max(0,R.p-m.p))/T.p + 2*(rk - Math.max(0,R.kcal-m.kcal))/T.kcal + 1.2*(rc - Math.max(0,R.c-m.c))/T.c;
      const pen = 4*Math.max(0, m.f - Math.max(0,fatRoom))/T.f + 3*Math.max(0, m.kcal - rk)/T.kcal + 2*Math.max(0, m.p - (rp+10))/T.p;
      const s = gain - pen;
      if (!best || s > best.s) best = { cd, s };
    });
    if (!best || best.s < 0.03) break;
    picks.push(best.cd); taken.add(best.cd.food.id);
    R = { kcal:R.kcal-best.cd.m.kcal, p:R.p-best.cd.m.p, c:R.c-best.cd.m.c }; fatRoom -= best.cd.m.f;
  }
  return { picks, note: picks.length ? '' : 'Nothing in your list fits without breaking a cap or the fat ceiling.' };
}

/* ---------- rings ---------- */
function ringSVG(list, size, stroke, anim, cls=''){
  const c = size / 2;
  let s = `<svg class="rings ${anim ? 'anim' : ''} ${cls}" viewBox="0 0 ${size} ${size}" width="${size}" height="${size}" aria-hidden="true">`;
  list.forEach((r, i) => {
    const rad = c - stroke/2 - i*(stroke + 3), C = 2*Math.PI*rad, p = Math.max(0, Math.min(1, r.pct || 0)), off = C*(1-p);
    s += `<circle cx="${c}" cy="${c}" r="${rad.toFixed(2)}" fill="none" stroke="${r.color}" stroke-opacity=".16" stroke-width="${stroke}"/>`;
    s += `<circle class="arc" cx="${c}" cy="${c}" r="${rad.toFixed(2)}" fill="none" stroke="${r.color}" stroke-width="${stroke}" stroke-linecap="round"
      stroke-dasharray="${C.toFixed(2)}" stroke-dashoffset="${off.toFixed(2)}" style="--c:${C.toFixed(2)}" opacity="${p > 0 ? 1 : 0}" transform="rotate(-90 ${c} ${c})"/>`;
  });
  return s + '</svg>';
}

/* ---------- session card ---------- */
function sessionCard(plan, date){
  const wk = S.workouts[date];
  const total = plan.items.reduce((a, it) => a + Math.max(it.sug.sets, setsDone(wk, it.id).length), 0);
  const done = plan.items.reduce((a, it) => a + setsDone(wk, it.id).length, 0);
  const pct = total ? done / total : 0;
  const meta = plan.past ? `${plan.items.length} exercise${plan.items.length === 1 ? '' : 's'} logged`
    : plan.items.length ? `${plan.items.length} exercises, about ${plan.minutes} min` : 'Nothing planned';
  let h = `<div class="group pad session">
    <div class="top">
      <div class="sring">${ringSVG([{ pct, color:'var(--accent)' }], 64, 8, ui.anim)}<div class="lbl">${total ? Math.round(pct*100) + '%' : '–'}</div></div>
      <div class="grow"><div class="session-title">${esc(plan.title)}</div><div class="meta">${meta}${done ? `, ${done} of ${total} sets done` : ''}</div></div>

  if (plan.why.length > 1) {
    h += `<div class="collapse ${ui.showWhy ? 'open' : ''}" id="whybox"><div>${plan.why.slice(1).map(w => `<p class="why">${esc(w)}</p>`).join('')}</div></div>

function refreshSession(date){

function viewTrain(){
  const date = ui.date, plan = getPlan(date);
  let h = `<h1 class="lt">Train</h1>` + weekStrip() + sessionCard(plan, date);
  if (plan.items.length) h += `<div class="group">${plan.items.map(it => exRow(it, date)).join('')}</div>`;

/* =====================================================================

   ===================================================================== */
function macroRow(label, cssVar, val, target, kind){
  const pct = Math.max(0, Math.min(100, target ? val/target*100 : 0));
  const over = kind === 'ceiling' && val > target;
  const g = label === 'kcal' ? '' : ' g';
  const sub = kind === 'floor' ? (val >= target ? 'floor reached' : `${r0(target - val)}${g} to go`)
            : kind === 'ceiling' ? (val > target ? `${r0(val - target)}${g} over` : `${r0(target - val)}${g} room`)
            : (val > target ? `${r0(val - target)}${g} over` : `${r0(target - val)}${g} left`);
  return `<div class="macro" style="--c:var(${cssVar})">
    <div class="lab"><i></i>${label}</div>
    <div class="bar ${over ? 'over' : ''}" role="img" aria-label="${label} ${r0(val)} of ${target}"><i style="width:${pct}%"></i></div>
    <div class="val num">${r0(val)}${label === 'kcal' ? '' : `<span class="of"> / ${target}</span>`}<small>${label === 'kcal' ? `of ${target}` : sub}</small></div>
  </div>`;
}
function capChips(date){
  const u = capUsage(date), caps = S.settings.caps;
  return Object.keys(DEFAULT_CAPS).map(k => {
    const cur = k === 'chicken' || k === 'quark' ? r0(u[k]) : r1(u[k]), cap = caps[k];
    const cls = u[k] > cap + 0.001 ? 'over' : u[k] >= cap - 0.001 ? 'full' : '';
    return `<span class="cap ${cls}">${CAP_LABEL[k]} ${fmtW(cur)}/${cap}${CAP_UNIT[k]}</span>`;
  }).join('');
}
function entryRow(e){
  return `<div class="swipe ${ui.flash === e.id ? 'flash' : ''}" data-id="${e.id}">
    <button class="swipe-del" data-act="swipedel" data-id="${e.id}" tabindex="-1" aria-hidden="true">Delete</button>
    <button class="entry cols swipe-fg" data-act="editentry" data-id="${e.id}">
      <span><span class="nm">${esc(e.name)}</span><br><span class="q">${esc(qtyText(e))}</span></span>
      <span class="t">${r0(e.kcal)}</span><span class="t">${r0(e.p)}</span><span class="t">${r0(e.f)}</span><span class="t">${r0(e.c)}</span></button></div>`;
}
function slotBlock(key, label, date){

    <span class="t">${r0(t.kcal)}</span><span class="t">${r0(t.p)}</span><span class="t">${r0(t.f)}</span><span class="t">${r0(t.c)}</span></div>

}

  h += `<h2>Meals</h2><div class="cols legend" aria-hidden="true"><span></span><span class="h" style="color:var(--kcal-t)">kcal</span><span class="h" style="color:var(--pro-t)">P</span><span class="h" style="color:var(--fat-t)">F</span><span class="h" style="color:var(--carb-t)">C</span></div>`;
  h += SLOTS.map(([k,l]) => slotBlock(k, l, date)).join('') + slotBlock('imported', 'Imported day total', date);
  h += `<p class="note" style="margin:0 4px 12px">Swipe a food left to delete it, or tap it to change the amount. Quick entry and copying meals from another day are under ${'⋯'} at the top.</p>`;

/* =====================================================================
   PROGRESS VIEW
   ===================================================================== */
function barChart(days, vals, target, color, floor){
  const W = 340, H = 132, top = 10, bot = 20, n = days.length, bw = W / n * 0.6, max = Math.max(target * 1.3, ...vals, 1);
  const y = v => top + (H - top - bot) * (1 - v / max);
  let s = `<svg class="chart ${ui.anim ? 'anim' : ''}" viewBox="0 0 ${W} ${H}" role="img" aria-label="Last ${n} days">`;
  vals.forEach((v, i) => {
    const x = i * (W / n) + (W / n - bw) / 2, hgt = v > 0 ? (H - top - bot) * v / max : 0;
    const done = days[i] < todayStr(), bad = done && (floor ? (v > 0 && v < target * 0.9) : (v > target * 1.1));
    s += `<rect class="b" x="${x.toFixed(1)}" y="${(H - bot - hgt).toFixed(1)}" width="${bw.toFixed(1)}" height="${hgt.toFixed(1)}" rx="${Math.min(5, bw/2).toFixed(1)}" fill="${bad ? 'var(--red)' : color}" opacity="${v>0?1:0}" style="animation-delay:${i*28}ms"/>`;
    if (i % 2 === n % 2) s += `<text x="${(x + bw/2).toFixed(1)}" y="${H - 5}" text-anchor="middle">${parseD(days[i]).getDate()}</text>`;
  });
  s += `<line x1="0" x2="${W}" y1="${y(target).toFixed(1)}" y2="${y(target).toFixed(1)}" stroke="var(--ink3)" stroke-width="1.2" stroke-dasharray="4 4"/>`;
  s += `<text x="${W-2}" y="${(y(target)-4).toFixed(1)}" text-anchor="end">${target}</text></svg>`;
  return s;
}
function spark(vals, w=84, h=30){
  if (vals.length < 2) return `<svg width="${w}" height="${h}" aria-hidden="true"><circle cx="${w-4}" cy="${h/2}" r="3.6" fill="var(--accent)"/></svg>`;
  const mn = Math.min(...vals), mx = Math.max(...vals), span = (mx - mn) || 1;
  const pts = vals.map((v,i) => [ (i/(vals.length-1))*(w-8)+4, h-4-((v-mn)/span)*(h-8) ]);
  return `<svg width="${w}" height="${h}" aria-hidden="true"><polyline points="${pts.map(p=>p.map(x=>x.toFixed(1)).join(',')).join(' ')}" fill="none" stroke="var(--accent)" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/><circle cx="${pts[pts.length-1][0].toFixed(1)}" cy="${pts[pts.length-1][1].toFixed(1)}" r="3.6" fill="var(--accent)"/></svg>`;
}
function viewProgress(){
  const t = todayStr();
  const days = Array.from({ length:14 }, (_, i) => addDays(t, i - 13));
  const kc = days.map(d => r0(sumMacros(dayEntries(d)).kcal)), pr = days.map(d => r0(sumMacros(dayEntries(d)).p));
  const logged = days.filter((d,i) => kc[i] > 0), avg = a => a.length ? r0(a.reduce((x,y)=>x+y,0)/a.length) : 0;
  const week = Array.from({ length:7 }, (_, i) => addDays(t, -i));
  const sessions = week.filter(d => loggedIds(S.workouts[d]).length).length;
  const unit = 'font-family:var(--font);font-weight:500';
  let h = `<h1 class="lt">Progress</h1><div class="group pad"><div class="stat">
    <div><div class="num">${sessions}</div><div class="small muted">workouts this week</div></div>
    <div><div class="num" style="color:var(--pro-t)">${avg(pr.filter(x=>x>0))}</div><div class="small muted">avg protein, g</div></div>
    <div><div class="num" style="color:var(--kcal-t)">${fmtInt(avg(kc.filter(x=>x>0)))}</div><div class="small muted">avg kcal</div></div></div></div>`;
  h += `<h2>Calories, 14 days</h2><div class="group pad">${barChart(days, kc, S.settings.targets.training.kcal, 'var(--kcal)', false)}<p class="note" style="margin:6px 0 0">Dashed line is the training-day target. Red bars are finished days more than 10% over it.</p></div>`;
  h += `<h2>Protein, 14 days</h2><div class="group pad">${barChart(days, pr, S.settings.targets.training.p, 'var(--pro)', true)}<p class="note" style="margin:6px 0 0">Red bars are finished days more than 10% under the floor. ${logged.length} of 14 days have food logged.</p></div>`;

  const waist = (S.waist || []).slice().sort((a,b) => a.date < b.date ? -1 : 1);
  h += `<h2>Waist</h2><div class="group pad">`;
  if (waist.length) {
    const first = waist[0], last = waist[waist.length-1], delta = r1(last.cm - first.cm);
    h += `<div class="row"><div class="num" style="font-size:44px;line-height:.95">${fmtW(last.cm)}<span class="small muted" style="${unit}"> cm</span></div><div class="grow">${spark(waist.map(x=>x.cm), 92, 36)}</div><div class="right small" style="color:${delta <= 0 ? 'var(--green-ink)' : 'var(--red-ink)'};font-weight:600">${delta > 0 ? '+' : ''}${delta} cm<div class="muted" style="font-weight:400">since ${dateLabel(first.date)}</div></div></div>`;
  }
  h += `<div class="row gap16"><input id="waistcm" class="field" style="max-width:120px" inputmode="decimal" placeholder="cm" aria-label="Waist in cm"><button class="btn small" data-act="addwaist">Save waist</button></div>
    <p class="note" style="margin:10px 0 0">Morning, after the toilet, before food, just below the navel. Skip it the day after a salty or heavy meal.</p></div>`;
  if (waist.length) h += `<div class="group">` + waist.slice().reverse().slice(0,6).map(x => `<div class="lift"><div><strong>${fmtW(x.cm)} cm</strong><div class="small muted">${dateLabel(x.date)}${x.note ? ', ' + esc(x.note) : ''}</div></div><span></span><button class="link" data-act="delwaist" data-date="${x.date}">Remove</button></div>`).join('') + `</div>`;

  h += `<h2>Lifts</h2>`;
  const rows = Object.keys(EX).map(id => {
    const ds = workoutDates().filter(d => setsDone(S.workouts[d], id).length);
    if (!ds.length) return null;
    const tops = ds.map(d => Math.max(...setsDone(S.workouts[d], id).map(s => +s.w || 0)));
    const lastSets = setsDone(S.workouts[ds[ds.length-1]], id), top = tops[tops.length-1];
    const reps = Math.max(...lastSets.filter(s => (+s.w||0) === top).map(s => +s.r));
    return `<div class="lift"><div><strong>${esc(cfg(id).name)}</strong><div class="small muted">${ds.length} session${ds.length>1?'s':''}, last ${dateLabel(ds[ds.length-1])}</div></div>
      <div class="num right">${fmtW(top)}<span class="small muted" style="${unit}"> ×${reps}</span></div><div>${spark(tops.slice(-8))}</div></div>`;
  }).filter(Boolean);
  h += rows.length ? `<div class="group">${rows.join('')}</div>` : `<p class="empty">Log a workout and your lifts show up here.</p>`;
  return h;
}

  if (e.target.closest('.week')) wk = { id:e.pointerId, x0:e.clientX, y0:e.clientY };
}, { passive:true });
document.addEventListener('pointermove', e => {
  if (td && e.pointerId === td.id) {
    const ind = $('#tabind');
    if (!td.drag) { if (Math.abs(e.clientX - td.x0) < 8) return; td.drag = true; ind.classList.add('lens'); clearTimeout(ind._lt); unlight(); }

    sg.dx = Math.max(3 - th.offsetLeft, Math.min(sg.seg.clientWidth - 3 - th.offsetWidth - th.offsetLeft, dx));
    th.style.transform = `translateX(${sg.dx}px)`;
    const c = th.offsetLeft + sg.dx + th.offsetWidth / 2;
    sg.btns.forEach(b => b.classList.toggle('mag', Math.abs(b.offsetLeft + b.offsetWidth / 2 - c) < th.offsetWidth * .5));
  }
}, { passive:true });
function endLiquid(e){
  unlight();
  if (td && e.pointerId === td.id) {
    const t = td; td = null;
    if (t.drag) {
      const ind = $('#tabind'), tabs = $$('#tabs .tab'), i = Math.max(0, Math.min(tabs.length - 1, Math.round((t.x - 4) / ind.offsetWidth)));

      H.tab(tabs[i], null, t.x);
    }
  }
  if (sg && e.pointerId === sg.id) {
    const s = sg, key = s.seg.getAttribute('aria-label') || '', th = $('.seg-thumb', s.seg); sg = null;
    s.btns.forEach(b => b.classList.remove('mag'));
    if (s.drag && th) {
      const from = th.getBoundingClientRect().left, c = th.offsetLeft + s.dx + th.offsetWidth / 2;
      const j = Math.max(0, Math.min(s.btns.length - 1, Math.floor((c - 3) / ((s.seg.clientWidth - 6) / s.btns.length))));
      th.style.transform = '';
      if (j !== s.i) { segMemo[key] = j; s.btns[j].click(); }
      const seg2 = s.seg.isConnected ? s.seg : $$('.seg').find(x => (x.getAttribute('aria-label') || '') === key);
      if (seg2) { settleFrom($('.seg-thumb', seg2), from); lensFlash(seg2, 260); setTimeout(() => seg2.classList.remove('drag'), 540); }

    const w = wk, dx = e.clientX - w.x0, dy = e.clientY - w.y0; wk = null;
    if (e.type === 'pointerup' && Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy) * 1.5) { ui.weekAt = Date.now(); go(addDays(ui.date, dx < 0 ? 7 : -7)); }
  }
}
document.addEventListener('pointerup', endLiquid);
document.addEventListener('pointercancel', endLiquid);

document.addEventListener('click', e => {

});
document.addEventListener('input', e => {

  else if (t.id === 'entryqty' && ui.sheet) { const e2 = dayEntries(ui.date).find(x => x.id === ui.sheet.id), q = num(t.value) || 0; if (e2) $('#entryprev').innerHTML = previewHTML({ kcal:e2.k.kcal*q, p:e2.k.p*q, f:e2.k.f*q, c:e2.k.c*q }); }
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.dataset.chg === 'returning') { S.settings.returning = t.checked; saveState(); setTimeout(() => render(), reduced() ? 0 : 260); }
  else if (t.dataset.chg === 'creatine') { const w = S.water[ui.date] || (S.water[ui.date] = { ml:0, creatine:false }); w.creatine = t.checked; saveState(); }
  else if (t.dataset.set) setPath(t.dataset.set, t.value);
  else if (t.id === 'importfile' && t.files && t.files[0]) {
    const rd = new FileReader();
    rd.onload = () => { try { const obj = JSON.parse(rd.result); if (!obj || !obj.settings || !obj.workouts) throw new Error('bad'); S = migrate(obj); saveState(); render(); toast('Backup imported'); }
      catch(err) { toast('That file is not a Coach backup'); } };
    rd.readAsText(t.files[0]);
  }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && ui.menu) { closeMenu(); return; }
  if (e.key === 'Escape' && ui.sheet) { closeSheet(); return; }
  const t = e.target;
  if (e.key === 'Enter' && t.dataset && t.dataset.bind === 'set') {
    e.preventDefault();
    if (t.dataset.f === 'w') { const r = t.closest('.setrow').querySelector('input[data-f="r"]'); if (r) r.focus(); }
    else { t.blur(); if (num(t.value) > 0) startRest(t.dataset.ex); }
  }
});
let scrollRaf = 0;
window.addEventListener('scroll', () => { if (scrollRaf) return; scrollRaf = requestAnimationFrame(() => { scrollRaf = 0; onScroll(); }); }, { passive:true });
window.addEventListener('resize', () => closeMenu());
let _today = todayStr();
document.addEventListener('visibilitychange', () => {
  if (!document.hidden && todayStr() !== _today) { if (ui.date === _today) ui.date = todayStr(); _today = todayStr(); ui.anim = true; render(); }
  if (!document.hidden && !$('#timer').classList.contains('ghost')) tickRest();
});

if (typeof window !== 'undefined') window.__coach = { S: () => S, setS: v => { S = v; }, ui, render, getPlan, suggest, suggestGap, H, dayType, sumMacros, addEntry, foodById };
render();
