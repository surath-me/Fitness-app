<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F2F2F7">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Coach">
<meta name="color-scheme" content="light">
<title>Coach</title>
<style>
:root{
  --bg:#F2F2F7; --card:#FFFFFF; --ink:#000000; --ink2:#6C6C70; --ink3:#AEAEB2;
  --sep:rgba(60,60,67,.16); --fill:rgba(120,120,128,.16); --fill2:rgba(120,120,128,.10);
  --accent:#007AFF; --accent-press:#0062CC; --accent-t:rgba(0,122,255,.12);
  --red:#FF3B30; --red-t:rgba(255,59,48,.13); --red-ink:#D70015; --green-t:rgba(52,199,89,.17); --green-ink:#1F8A3B;
  /* macro colours (data only) */
  --kcal:#1C1C1E; --pro:#5856D6; --fat:#FFCC00; --carb:#34C759;
  --pro-t:#4644C8; --fat-t:#9A7400; --carb-t:#1F8A3B;
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display",system-ui,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --rounded:ui-rounded,"SF Pro Rounded",-apple-system,BlinkMacSystemFont,system-ui,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 17px/1.35 var(--font);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:inherit}
input,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:10px}
[hidden]{display:none!important}
.app{max-width:560px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 8px) 16px calc(118px + env(safe-area-inset-bottom))}

/* type */
h1{font-size:34px;line-height:1.1;font-weight:700;letter-spacing:-.022em;margin:6px 4px 6px}
h2{font-size:22px;line-height:1.2;font-weight:700;letter-spacing:-.015em;margin:28px 4px 10px}
h3{font-size:13px;font-weight:600;color:var(--ink2);margin:20px 8px 8px;letter-spacing:.005em}
p{margin:0 0 8px}
.num{font-family:var(--rounded);font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.muted{color:var(--ink2)}
.small{font-size:14px}
.tiny{font-size:12px}
.right{text-align:right}
.row{display:flex;align-items:center;gap:10px}
.grow{flex:1;min-width:0}
.gap8{margin-top:8px}.gap16{margin-top:16px}
.why{font-size:15px;line-height:1.35;color:var(--ink2);margin:0 4px 6px}
.note{font-size:13px;line-height:1.35;color:var(--ink2);margin:8px 8px 0}
.empty{padding:22px 8px;color:var(--ink2)}
.link{color:var(--accent);font-size:15px;font-weight:500}

/* grouped cards */
.group{background:var(--card);border-radius:24px;overflow:hidden;margin:0 0 16px}
.group.pad{padding:18px 16px}
.group>.switch{margin-left:16px;padding:0 16px 0 0;border-top:.5px solid var(--sep)}
.group>.switch:first-child{border-top:0}
.item{margin-left:16px;padding:8px 16px 8px 0;min-height:56px;display:flex;align-items:center;gap:10px}

/* date bar */
.datebar{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:48px}
.dlabel{display:flex;align-items:baseline;gap:8px;font-size:17px;font-weight:600}
.iconbtn{width:44px;height:44px;border-radius:50%;font-size:28px;line-height:1;text-align:center;color:var(--accent);
  background:rgba(255,255,255,.78);box-shadow:0 1px 6px rgba(0,0,0,.08),inset 0 0 0 .5px rgba(0,0,0,.04);padding-bottom:3px}
@supports (backdrop-filter:blur(10px)){.iconbtn{background:rgba(255,255,255,.6);backdrop-filter:blur(20px) saturate(180%);-webkit-backdrop-filter:blur(20px) saturate(180%)}}

/* controls */
.tools{display:grid;gap:12px;margin:14px 0 16px}
.seg{display:flex;background:var(--fill);border-radius:99px;padding:3px;gap:2px}
.seg button{flex:1;min-height:38px;border-radius:99px;font-weight:600;font-size:15px;text-align:center;color:var(--ink)}
.seg button[aria-pressed=true]{background:var(--card);box-shadow:0 2px 8px rgba(0,0,0,.12),0 0 0 .5px rgba(0,0,0,.04)}
.switch{display:flex;flex-direction:row-reverse;justify-content:space-between;align-items:center;gap:12px;min-height:52px;font-size:17px}
.switch input{appearance:none;-webkit-appearance:none;width:51px;height:31px;border-radius:99px;background:var(--fill);position:relative;flex:none;transition:background .2s}
.switch input::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 2px 5px rgba(0,0,0,.25);transition:transform .2s}
.switch input:checked{background:var(--accent)}
.switch input:checked::after{transform:translateX(20px)}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:50px;padding:0 22px;border-radius:99px;font-weight:600;font-size:17px;background:var(--accent);color:#fff}
.btn:active{background:var(--accent-press)}
.btn.ghost{background:var(--accent-t);color:var(--accent)}
.btn.danger{background:var(--red-t);color:var(--red-ink)}
.btn.block{display:flex;width:100%}
.btn.small{min-height:36px;padding:0 15px;font-size:15px}
.chip{display:inline-block;padding:4px 11px;border-radius:99px;font-size:13px;font-weight:600;background:var(--fill);color:var(--ink2);white-space:nowrap}
.chip.go{background:var(--accent);color:#fff}
.chip.hold{background:var(--fill);color:var(--ink2)}
.chip.low{background:var(--red-t);color:var(--red-ink)}
.chip.new{background:var(--accent-t);color:var(--accent)}
.chip.done{background:var(--green-t);color:var(--green-ink)}
.tag{display:block;font-size:13px;font-weight:500;color:var(--accent);margin:2px 0 0}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.qchip{min-height:42px;padding:0 16px;border-radius:99px;background:var(--card);font-weight:600;font-size:15px;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.qchip.on{background:var(--accent);color:#fff}
.gaps .qchip{background:var(--accent-t);color:var(--accent);box-shadow:none}
.gaps .qchip .muted{color:var(--accent);opacity:.75}

/* lifts */
.ex{margin-left:16px;border-top:.5px solid var(--sep)}
.ex:first-child{border-top:0}
.ex-head{display:grid;grid-template-columns:68px 1fr auto;gap:12px;align-items:center;width:100%;padding:14px 16px 14px 0;min-height:78px}
.wt{font-size:36px;line-height:.95;text-align:right}
.wt small{display:block;font-family:var(--font);font-weight:500;font-size:12px;color:var(--ink2);margin-top:4px;letter-spacing:0}
.ex-name{font-weight:600;font-size:17px;line-height:1.2}
.ex-sub{font-size:14px;line-height:1.3;color:var(--ink2);margin-top:3px}
.sets{padding:0 16px 16px 0}
.setrow,.setlab{display:grid;grid-template-columns:22px 1fr 1fr 40px;gap:8px;align-items:center}
.setrow{margin-bottom:8px}
.setrow .n{color:var(--ink2);font-size:15px;text-align:center}
.setrow input,.field{width:100%;height:46px;border-radius:12px;border:0;background:var(--fill2);padding:0 10px;font-family:var(--rounded);font-size:20px;font-weight:600;text-align:center;letter-spacing:-.01em}
.setrow input::placeholder,.field::placeholder{color:var(--ink3);font-weight:500}
.setrow input:focus,.field:focus{outline:2px solid var(--accent);outline-offset:0;background:var(--card)}
.setrow button{height:40px;border-radius:12px;color:var(--ink3);font-size:22px;text-align:center}
.setlab{font-size:12px;color:var(--ink2);margin-bottom:4px;text-align:center}
.cue{font-size:14px;color:var(--ink2);margin:0 0 12px}

/* macros */
.hero{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.hero .num{font-size:62px;line-height:.95}
.hero span.l{font-size:17px;font-weight:600;color:var(--ink2)}
.macro{display:grid;grid-template-columns:84px 1fr 104px;gap:10px;align-items:center;margin:13px 0 0}
.macro .lab{font-weight:600;font-size:15px;display:flex;align-items:center;gap:7px}
.macro .lab i{width:11px;height:11px;border-radius:50%;background:var(--c);flex:none}
.bar{height:12px;border-radius:99px;background:var(--fill);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:99px;background:var(--c);min-width:0}
.bar.over>i{background:var(--red)}
.macro .val{text-align:right;font-size:24px;line-height:1}
.macro .val .of{font-family:var(--font);font-weight:500;font-size:13px;color:var(--ink2);letter-spacing:0}
.macro .val small{display:block;font-family:var(--font);font-weight:500;font-size:12px;color:var(--ink2);margin-top:3px;letter-spacing:0}
.caps{display:flex;flex-wrap:wrap;gap:6px;margin:16px 0 0}
.cap{font-size:13px;font-weight:600;padding:5px 11px;border-radius:99px;background:var(--fill2);color:var(--ink2)}
.cap.full{background:var(--accent-t);color:var(--accent)}
.cap.over{background:var(--red-t);color:var(--red-ink)}
.cols{display:grid;grid-template-columns:1fr 46px 34px 34px 38px;gap:4px;align-items:baseline}
.cols .h{font-size:12px;font-weight:700;text-align:right}
.legend{padding:0 16px;margin:18px 0 6px}
.slot{margin-bottom:14px}
.slothead{padding:14px 16px 10px}
.slothead .nm{font-weight:700;font-size:17px}
.slothead .t{text-align:right;font-weight:700;font-size:14px;font-variant-numeric:tabular-nums;font-family:var(--rounded)}
.entry{width:calc(100% - 16px);margin-left:16px;padding:10px 16px 10px 0;border-top:.5px solid var(--sep);min-height:54px}
.entry .nm{font-size:16px;font-weight:500;line-height:1.2}
.entry .q{font-size:13px;color:var(--ink2)}
.entry .t{text-align:right;font-size:14px;font-variant-numeric:tabular-nums;font-family:var(--rounded);font-weight:600}
.addline{display:flex;align-items:center;gap:10px;min-height:52px;width:calc(100% - 16px);margin-left:16px;padding:0 16px 0 0;border-top:.5px solid var(--sep);color:var(--accent);font-weight:600;font-size:16px}
.addline::before{content:"+";display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;background:var(--accent);color:#fff;font-size:18px;line-height:1;padding-bottom:1px}

/* progress */
.chart{width:100%;height:auto;display:block}
.chart text{font-family:var(--font);fill:var(--ink2);font-size:10px}
.lift{display:grid;grid-template-columns:1fr auto 84px;gap:12px;align-items:center;margin-left:16px;padding:12px 16px 12px 0;border-top:.5px solid var(--sep)}
.lift:first-child{border-top:0}
.lift .num{font-size:24px}
.stat{display:flex;justify-content:space-between;gap:12px}
.stat .num{font-size:34px;line-height:1}

/* setup */
details{background:var(--card);border-radius:24px;margin:0 0 12px;overflow:hidden}
summary{list-style:none;cursor:pointer;min-height:58px;padding:0 18px;display:flex;align-items:center;justify-content:space-between;font-weight:600;font-size:17px}
summary::-webkit-details-marker{display:none}
summary::after{content:"";width:9px;height:9px;border-right:2.5px solid var(--ink3);border-bottom:2.5px solid var(--ink3);transform:rotate(-45deg);transition:transform .2s;margin-right:3px}
details[open] summary::after{transform:rotate(45deg)}
.form{display:grid;gap:12px;padding:2px 18px 18px}
.fl{display:grid;grid-template-columns:1fr 96px;gap:10px;align-items:center;font-size:16px}
.fl .field{height:42px;font-size:17px}
.fl select{height:42px;border-radius:12px;border:0;background:var(--fill2);padding:0 10px;font-size:16px}
.exset{display:grid;grid-template-columns:1fr 54px 54px 54px 54px;gap:6px;align-items:center;font-size:14px}
.exset .field{height:38px;font-size:15px;padding:0 4px}
.exset.h{font-size:12px;color:var(--ink2);text-align:center}

/* floating glass tab bar */
.tabs{position:fixed;left:0;right:0;bottom:calc(10px + env(safe-area-inset-bottom));z-index:20;display:flex;justify-content:center;padding:0 16px;pointer-events:none}
.tabs nav{pointer-events:auto;display:flex;width:100%;max-width:420px;padding:5px;border-radius:38px;background:rgba(255,255,255,.94);
  box-shadow:0 10px 34px rgba(0,0,0,.14),0 0 0 .5px rgba(0,0,0,.06),inset 0 1px 0 rgba(255,255,255,.9)}
@supports (backdrop-filter:blur(10px)){.tabs nav{background:rgba(255,255,255,.62);backdrop-filter:blur(30px) saturate(190%);-webkit-backdrop-filter:blur(30px) saturate(190%)}}
.tab{flex:1;min-height:56px;padding:7px 0 6px;border-radius:32px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11.5px;font-weight:600;color:var(--ink2);text-align:center}
.tab svg{width:25px;height:25px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tab[aria-current=page]{color:var(--accent);background:var(--accent-t)}
.tab[aria-current=page] svg{stroke-width:2.2}

/* floating sheet */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.32);z-index:30}
.sheet{position:fixed;left:8px;right:8px;bottom:calc(8px + env(safe-area-inset-bottom));margin:0 auto;max-width:544px;max-height:86vh;overflow:auto;border-radius:34px;padding:12px 16px 20px;z-index:31;overscroll-behavior:contain;
  background:rgba(242,242,247,.98);box-shadow:0 12px 50px rgba(0,0,0,.28)}
@supports (backdrop-filter:blur(10px)){.sheet{background:rgba(242,242,247,.93);backdrop-filter:blur(40px) saturate(180%);-webkit-backdrop-filter:blur(40px) saturate(180%)}}
.sheet h2{margin:2px 4px 6px}
.grab{width:38px;height:5px;border-radius:9px;background:var(--ink3);opacity:.6;margin:0 auto 10px}
.search{width:100%;height:46px;border-radius:14px;border:0;background:var(--fill);padding:0 14px 0 40px;font-size:17px;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='18' height='18' viewBox='0 0 24 24' fill='none' stroke='%236C6C70' stroke-width='2.4' stroke-linecap='round'><circle cx='11' cy='11' r='7'/><path d='M20 20l-3.5-3.5'/></svg>");background-repeat:no-repeat;background-position:13px center}
.food{display:grid;grid-template-columns:1fr auto;gap:8px;width:calc(100% - 16px);margin-left:16px;padding:11px 16px 11px 0;border-top:.5px solid var(--sep);min-height:56px;align-items:center}
.group>.food:first-child{border-top:0}
.food .nm{font-weight:500}
.food .m{font-size:13px;color:var(--ink2)}
.food .add{color:var(--accent);font-weight:600;font-size:15px}
.qty{display:grid;grid-template-columns:52px 1fr 52px;gap:8px;margin:12px 0}
.qty button{height:52px;border-radius:50%;width:52px;background:var(--accent-t);color:var(--accent);font-size:28px;text-align:center;padding-bottom:3px}
.qty .field{height:52px;font-size:26px;background:var(--card)}
.preview{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:6px 0 14px;text-align:center;background:var(--card);border-radius:20px;padding:14px 6px}
.preview .num{font-size:28px;line-height:1}
.preview small{display:block;font-size:12px;color:var(--ink2);font-weight:600;margin-top:2px}
body.lock{overflow:hidden}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(98px + env(safe-area-inset-bottom));background:rgba(28,28,30,.9);color:#fff;padding:11px 18px;border-radius:99px;font-weight:600;font-size:15px;z-index:25;max-width:88vw;text-align:center}
@supports (backdrop-filter:blur(10px)){.toast{background:rgba(28,28,30,.78);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px)}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<main id="app" class="app"></main>
<div class="tabs"><nav id="tabs" aria-label="Sections">
  <button class="tab" data-act="tab" data-tab="train"><svg viewBox="0 0 24 24"><path d="M3 9v6M6 6.5v11M18 6.5v11M21 9v6M6 12h12"/></svg>Train</button>
  <button class="tab" data-act="tab" data-tab="eat"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><circle cx="12" cy="12" r="4"/></svg>Eat</button>
  <button class="tab" data-act="tab" data-tab="progress"><svg viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>Progress</button>
  <button class="tab" data-act="tab" data-tab="setup"><svg viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></svg>Setup</button>
</nav></div>
<div id="scrim" class="scrim" data-act="closesheet" hidden></div>
<div id="sheet" class="sheet" role="dialog" aria-modal="true" hidden></div>
<div id="toast" class="toast" role="status" hidden></div>
<script>
'use strict';
/* =====================================================================
   CONFIG. Edit this block (or ask Claude to) to change foods, lifts,
   sessions and defaults. Your logs live in the browser and are not
   touched when this changes.
   ===================================================================== */
const APP_VERSION = '1.0';
const LS_KEY = 'coach-v1';

const DEFAULT_TARGETS = {
  training: { kcal: 2250, p: 160, f: 70, c: 235 },   // f = ceiling, p = floor
  rest:     { kcal: 2000, p: 160, f: 65, c: 175 }
};
const DEFAULT_CAPS = { egg: 3, whey: 1, quark: 250, chicken: 150, pudding: 2 };  // per day; pudding per 7 days
const CAP_LABEL = { egg: 'Eggs', whey: 'Whey', quark: 'Quark', chicken: 'Chicken', pudding: 'Pudding' };
const CAP_UNIT  = { egg: '', whey: '', quark: ' g', chicken: ' g', pudding: ' this week' };

/* ---------- Lifts ----------
   kind: compound | iso. low/high = rep range, sets = target sets, inc = next jump.
   prio: lower number survives time trimming first. ord: order on the day.
   start: weight to try when there is no history. single: left leads, right matches. */
const EX = {
  leg_press:        { name:'Leg press',                    muscle:'quads',     kind:'compound', low:10, high:12, sets:3, inc:10,  unit:'kg', prio:1, ord:1,  cue:'Full range, feet mid-platform, do not lock the knees.' },
  vertical_squat:   { name:'Vertical squat machine',       muscle:'quads',     kind:'compound', low:10, high:12, sets:3, inc:10,  unit:'kg', prio:3, ord:2,  cue:'Different lift from the leg press, log it separately.' },
  leg_ext:          { name:'Leg extension',                muscle:'quads',     kind:'iso',      low:10, high:12, sets:3, inc:7,   unit:'kg', prio:4, ord:3,  cue:'Pause one second at the top. Stacks differ by branch.' },
  leg_curl:         { name:'Leg curl',                     muscle:'hams',      kind:'iso',      low:10, high:12, sets:3, inc:3.5, unit:'kg', prio:4, ord:4,  start:32, cue:'Log the real reps, not the target.' },
  chest_press:      { name:'Machine chest press',          muscle:'chest',     kind:'compound', low:8,  high:12, sets:3, inc:2.5, unit:'kg', prio:1, ord:10, cue:'First while fresh. Hold the weight until 3 clean sets.' },
  incline_iso_press:{ name:'Incline iso-lateral press',    muscle:'chest',     kind:'compound', low:8,  high:12, sets:3, inc:2.5, unit:'kg/side', prio:3, ord:11, start:10, cue:'Weight is per side. Upper chest.' },
  lat_pulldown:     { name:'Lat pulldown',                 muscle:'back',      kind:'compound', low:8,  high:12, sets:3, inc:5,   unit:'kg', prio:1, ord:12, cue:'Pull with the elbows, control the way up.' },
  row_bilateral:    { name:'Bilateral machine row',       muscle:'back',      kind:'compound', low:10, high:12, sets:3, inc:5,   unit:'kg/side', prio:2, ord:13, cue:'Weight is per side.' },
  seated_row:       { name:'Seated cable row',             muscle:'back',      kind:'compound', low:10, high:12, sets:3, inc:4,   unit:'kg', prio:3, ord:14, cue:'Neutral grip, chest up.' },
  iso_row:          { name:'Hammer Strength iso-lateral row', muscle:'back',   kind:'compound', low:8,  high:12, sets:3, inc:2.5, unit:'kg/side', prio:5, ord:16, start:5, cue:'Needs a retest. Elbow-limited baseline.' },
  shoulder_press:   { name:'Machine shoulder press',       muscle:'shoulders', kind:'compound', low:8,  high:12, sets:3, inc:2.5, unit:'kg', prio:2, ord:15, cue:'Order-dependent: do it before the arms.' },
  pec_deck:         { name:'Pec deck',                     muscle:'chest',     kind:'iso',      low:10, high:12, sets:3, inc:4,   unit:'kg', prio:8, ord:20, cue:'Not the same machine as the pec fly.' },
  pec_fly:          { name:'Pec fly',                      muscle:'chest',     kind:'iso',      low:10, high:12, sets:3, inc:2.5, unit:'kg', prio:5, ord:21, cue:'Separate machine from the pec deck.' },
  lat_raise:        { name:'Dumbbell lateral raise',     muscle:'shoulders', kind:'iso',      low:10, high:12, sets:3, inc:2,   unit:'kg each hand', prio:6, ord:22, cue:'Light and controlled, lead with the elbow.' },

const loggedIds = wk => wk && wk.ex ? Object.keys(wk.ex).filter(id => EX[id] && setsDone(wk,id).length) : [];

function lastTrained(muscle, before){          // most recent date (< before) with any logged set for this muscle
  const ds = workoutDates().filter(d => d < before).reverse();
  for (const d of ds) for (const id of loggedIds(S.workouts[d])) if (EX[id].muscle === muscle) return d;
  return null;
}
function loggedSince(id, from, to){            // logged on or after `from`, before `to`
  return workoutDates().some(d => d >= from && d < to && setsDone(S.workouts[d], id).length > 0);
}
function lowerRecently(date, days=5){
  return workoutDates().some(d => d < date && diffDays(d, date) <= days &&
    loggedIds(S.workouts[d]).filter(id => LOWER.includes(EX[id].muscle)).length >= 2);
}
function liftHistory(id, before){                  // sessions (newest first) with sets for this lift, dates < before
  return workoutDates().filter(d => d < before).reverse()
    .map(d => ({ date:d, sets:setsDone(S.workouts[d], id).map(s => ({w:+s.w||0, r:+s.r})) }))
    .filter(h => h.sets.length);
}

/* ---------- progression (double progression) ----------
   All sets reached the top of the rep range (and you did enough sets) -> add weight.
   Otherwise hold. Two sessions in a row under the bottom of the range -> go lighter.
   Gap rules: 5-14 days off = same weight, first set as a check; 15+ days = one step lighter. */
function suggest(id, date){
  const c = cfg(id), hist = liftHistory(id, date);
  if (!hist.length) {
    return { status:'new', w: c.start ?? null, sets:c.sets, low:c.low, high:c.high,
             text: c.start ? `Start around ${fmtW(c.start)} ${c.unit}. Log it to set a baseline.` : 'No baseline yet. Start light and log it.',
             last:'' };
  }
  const last = hist[0], W = Math.max(...last.sets.map(s => s.w));
  const lastTxt = last.sets.map(s => `${fmtW(s.w)}×${s.r}`).join(', ');
  const atW = last.sets.filter(s => s.w === W);
  const allClean = last.sets.length >= c.sets && last.sets.every(s => s.r >= c.high);
  let status, w, text;
  const prev = hist[1];
  const prevW = prev ? Math.max(...prev.sets.map(s => s.w)) : null;
  const failTwice = prev && prevW === W &&
    Math.max(...atW.map(s=>s.r)) < c.low && Math.max(...prev.sets.filter(s=>s.w===W).map(s=>s.r)) < c.low;
  if (failTwice) {
    status = 'low'; w = Math.max(0, r1(W - c.inc));
    text = `Go lighter: ${fmtW(w)} ${c.unit}. Two sessions under ${c.low} reps at ${fmtW(W)}.`;
  } else if (allClean) {
    status = 'go'; w = r1(W + c.inc);
    text = `Add weight: ${fmtW(w)} ${c.unit}, aim for ${c.sets}×${c.low}+.`;
  } else {
    status = 'hold'; w = W;
    text = `Hold ${fmtW(W)} ${c.unit}: ${c.sets} sets of ${c.high} before adding weight.`;
  }
  const lastAny = workoutDates().filter(d => d < date).pop();
  const gap = lastAny ? diffDays(lastAny, date) : 0;
  if (gap >= 15 && status !== 'low') { status = 'low'; w = Math.max(0, r1(w - c.inc));
    text = `Back after ${gap} days off: start at ${fmtW(w)} ${c.unit}, one step down.`; }
  else if (gap >= 5 && gap < 15) text += ` ${gap} days since your last workout: treat set 1 as a check.`;
  if (S.settings.returning && status !== 'low') { w = Math.max(0, r1(w - c.inc)); status = 'low';
    text = `Back after a break: ${fmtW(w)} ${c.unit} for set 1, add from set 2 if it feels easy.`; }
  return { status, w, sets:c.sets, low:c.low, high:c.high, text, last:lastTxt, lastDate:last.date, topW:W };
}

/* ---------- planner ----------
   Scheduled session for the day + everything still owed from the last 7 days
   (exercise by exercise), minus what needs recovery, trimmed to the time you have. */
const needGap = c => c.kind === 'compound' ? 2 : 1;      // days since the muscle was last trained

function computeOwed(date){
  const out = new Map();
  for (let k = 1; k <= 7; k++) {
    const d = addDays(date, -k);
    if (d < S.settings.planStart) continue;
    const t = S.settings.schedule[wdOf(d)];
    if (!t || !TEMPLATES[t] || S.dismissed[d]) continue;
    TEMPLATES[t].ex.forEach(id => {
      if (out.has(id) || !EX[id]) return;
      if (loggedSince(id, d, date)) return;
      out.set(id, { id, from:d, tid:t });
    });
  }
  return Array.from(out.values());
}
function minutesFor(id){ const c = cfg(id); return c.muscle === 'abs' ? ABS_MIN : (MINUTES[c.kind] || 8); }

function buildPlan(date, opts={}){
  const today = todayStr(), budget = opts.budget || S.settings.timeBudget;
  const wd = wdOf(date), why = [], deferred = [];
  const wk = S.workouts[date];
  let tid = opts.templateId !== undefined ? opts.templateId : S.settings.schedule[wd];
  if (S.dismissed[date] && opts.templateId === undefined) tid = null;
  const tpl = tid && TEMPLATES[tid] ? TEMPLATES[tid] : null;

  // past days: show what was logged, nothing else
  if (date < today) {
    const ids = new Set(loggedIds(wk).concat((wk && wk.added) || []));
    const items = Array.from(ids).sort((a,b) => EX[a].ord - EX[b].ord).map(id => ({ id, origin:'logged', sug: suggest(id, date) }));
    return { date, tid, title: items.length ? 'Logged workout' : 'No workout logged', why:[ items.length ? 'Editing a past day.' : 'Nothing was logged on this day.' ],
             items, deferred:[], minutes:0, budget, past:true, owed:[] };
  }

  const pool = new Map();
  if (tpl) { tpl.ex.forEach(id => pool.set(id, { id, from:date, origins:['today'], tid })); why.push(`${WD[wd]}: ${tpl.name} is scheduled.`); }
  else why.push(S.dismissed[date] ? `You skipped today's scheduled session.` : `${WD[wd]} is an off day in your split.`);

  let owed = [];
  if (date === today) {
    owed = computeOwed(date);
    const groups = {};
    owed.forEach(o => { const key = o.from + '|' + o.tid; (groups[key] = groups[key] || []).push(o); });
    owed.forEach(o => { if (pool.has(o.id)) pool.get(o.id).origins.push('carried'); else pool.set(o.id, { id:o.id, from:o.from, origins:['carried'], tid:o.tid }); });
    Object.keys(groups).sort().forEach(key => {
      const [d, t] = key.split('|');
      const names = groups[key].map(o => cfg(o.id).name.toLowerCase());
      why.push(`Carried over from ${WD[wdOf(d)]} (${TEMPLATES[t].name}, not logged): ${joinNames(names)}.`);
    });
  }

  // recovery and lower-body rules
  const kept = [];
  const rested = [], lowerWait = [];
  const lowerBlock = lowerRecently(date);
  pool.forEach(it => {
    const c = cfg(it.id);
    const ran = setsDone(wk, it.id).length > 0;          // already being logged today: never drop
    if (!ran) {
      const lt = lastTrained(c.muscle, date);
      if (lt && diffDays(lt, date) < needGap(c) && !opts.ignoreRecovery) { rested.push(it); deferred.push({ id:it.id, reason:`${MUSCLE_LABEL[c.muscle].toLowerCase()} trained ${diffDays(lt,date)===1?'yesterday':diffDays(lt,date)+' days ago'}` }); return; }
      if (LOWER.includes(c.muscle) && lowerBlock && !opts.ignoreRecovery) { lowerWait.push(it); deferred.push({ id:it.id, reason:'legs already trained this week' }); return; }
    }
    kept.push(it);
  });
  if (rested.length) why.push(`Held back for recovery: ${joinNames(rested.map(i => cfg(i.id).name.toLowerCase()))}.`);
  if (lowerWait.length) why.push(`Legs were trained in the last 5 days, so lower-body work waits.`);

  // time budget: compounds first, then by priority, older owed first
  const ranked = kept.slice().sort((a,b) => {
    const ca = cfg(a.id), cb = cfg(b.id);
    return (ca.kind==='compound'?0:1) - (cb.kind==='compound'?0:1) || ca.prio - cb.prio || (a.from < b.from ? -1 : 1);
  });
  let used = 0; const chosen = [], trimmed = [];
  ranked.forEach(it => {
    const m = minutesFor(it.id), forced = setsDone(wk, it.id).length > 0;
    if (forced || used + m <= budget || chosen.length < 3) { chosen.push(it); used += m; } else trimmed.push(it);
  });
  trimmed.forEach(it => deferred.push({ id:it.id, reason:`did not fit ${budget} min` }));
  if (trimmed.length) why.push(`To fit ${budget} minutes, these move to your next session: ${joinNames(trimmed.map(i => cfg(i.id).name.toLowerCase()))}. They stay on your list for 7 days.`);

  // anything added by hand or already logged today
  const present = new Set(chosen.map(i => i.id));
  const extra = new Set(((wk && wk.added) || []).concat(loggedIds(wk)));
  extra.forEach(id => { if (EX[id] && !present.has(id)) { chosen.push({ id, from:date, origins:['added'] }); present.add(id); } });

  chosen.sort((a,b) => cfg(a.id).ord - cfg(b.id).ord);
  const items = chosen.map(it => ({ id:it.id, origin: it.origins.includes('carried') ? 'carried' : it.origins.includes('added') ? 'added' : 'today', from:it.from, sug: suggest(it.id, date) }));

  let title;
  const carriedNames = Array.from(new Set(owed.map(o => TEMPLATES[o.tid].name)));
  if (tpl && owed.length && items.some(i => i.origin === 'carried')) title = `${tpl.name} plus carried work`;
  else if (tpl) title = tpl.name;
  else if (items.length && carriedNames.length) title = `Carried: ${joinNames(carriedNames)}`;
  else if (items.length) title = 'Workout';
  else title = 'Rest day';
  return { date, tid, title, why, items, deferred, minutes:used, budget, past:false, owed };
}

/* ---------- foods and macros ---------- */
const allFoods = () => FOODS.concat(S.foods || []);
const foodById = id => allFoods().find(f => f.id === id);
const macrosFor = (food, qty) => { const k = food.unit === 'g' ? qty/100 : qty; return { kcal:food.kcal*k, p:food.p*k, f:food.f*k, c:food.c*k }; };
const perUnit = food => { const k = food.unit === 'g' ? 1/100 : 1; return { kcal:food.kcal*k, p:food.p*k, f:food.f*k, c:food.c*k }; };
function makeEntry(food, qty, slot){
  const m = macrosFor(food, qty);
  return { id:uid(), food:food.id, name:food.name, unit:food.unit, qty:+qty, slot, kcal:m.kcal, p:m.p, f:m.f, c:m.c,
           k:perUnit(food), cap:food.cap||null, capQty: food.cap ? qty*(food.capMul||1) : 0 };
}
function addEntry(date, food, qty, slot){
  const e = makeEntry(food, qty, slot);
  (S.days[date] = S.days[date] || { entries:[] }).entries.push(e);
  saveState(); return e;
}
const dayEntries = date => (S.days[date] && S.days[date].entries) || [];
const sumMacros = list => list.reduce((a,e) => ({ kcal:a.kcal+e.kcal, p:a.p+e.p, f:a.f+e.f, c:a.c+e.c }), { kcal:0, p:0, f:0, c:0 });
function dayType(date){
  const d = S.days[date]; if (d && d.type) return d.type;
  if (loggedIds(S.workouts[date]).length) return 'training';
  if (date < todayStr()) return 'rest';
  return buildPlan(date, { templateId: ui.forceTpl[date] }).items.length ? 'training' : 'rest';
}
const dayTarget = date => S.settings.targets[dayType(date)];
function capUsage(date){
  const u = { egg:0, whey:0, quark:0, chicken:0, pudding:0 };
  dayEntries(date).forEach(e => { if (e.cap && e.cap !== 'pudding') u[e.cap] += e.capQty; });
  for (let i = 0; i < 7; i++) dayEntries(addDays(date, -i)).forEach(e => { if (e.cap === 'pudding') u.pudding += e.capQty; });
  return u;
}
function qtyText(e){
  if (e.unit === 'day') return 'imported total';
  if (e.unit === 'g') return `${fmtW(e.qty)} g`;
  return `${fmtW(e.qty)} × ${e.unit}`;
}

/* what would close the gap, using only your foods and respecting your caps */
function suggestGap(date){
  const T = dayTarget(date), cur = sumMacros(dayEntries(date)), used = capUsage(date), caps = S.settings.caps;
  let R = { kcal:T.kcal-cur.kcal, p:T.p-cur.p, c:T.c-cur.c }, fatRoom = T.f - cur.f;
  if (R.kcal < 100 && R.p < 8) return { picks:[], note:'On target. Nothing to add.' };
  const room = key => Math.max(0, caps[key] - used[key]);
  const cands = [];
  const add = (id, qty) => { const f = foodById(id); if (f && qty > 0) cands.push({ food:f, qty, m:macrosFor(f, qty) }); };
  if (room('quark') >= 100) add('quark', Math.min(250, room('quark')));
  if (room('whey') >= 1) add('whey', 1);
  if (room('chicken') >= 50) add('chicken_c', Math.min(150, room('chicken')));
  if (room('egg') >= 1) add('egg', Math.min(3, room('egg')));
  if (room('pudding') >= 1) add('pudding', 1);
  [['tuna',100],['chana',200],['rice',150],['rice',250],['banana',1],['grapes',150],['kaki',100],['mango',100],['ricecakes',100],
   ['bread',2],['wrap',1],['pasta',200],['potato',1],['oil_tsp',2],['ghee_tbsp',1],['peanutbutter',20],['oats',40]].forEach(([i,q]) => add(i,q));
  const picks = [], taken = new Set();
  for (let round = 0; round < 3; round++) {
    let best = null;
    cands.forEach(cd => {
      if (taken.has(cd.food.id)) return;
      const m = cd.m, rp = Math.max(0,R.p), rk = Math.max(0,R.kcal), rc = Math.max(0,R.c);
      const gain = 3*(rp - Math.max(0,R.p-m.p))/T.p + 2*(rk - Math.max(0,R.kcal-m.kcal))/T.kcal + 1.2*(rc - Math.max(0,R.c-m.c))/T.c;
      const pen = 4*Math.max(0, m.f - Math.max(0,fatRoom))/T.f + 3*Math.max(0, m.kcal - rk)/T.kcal + 2*Math.max(0, m.p - (rp+10))/T.p;
      const s = gain - pen;
      if (!best || s > best.s) best = { cd, s };
    });
    if (!best || best.s < 0.03) break;
    picks.push(best.cd); taken.add(best.cd.food.id);
    R = { kcal:R.kcal-best.cd.m.kcal, p:R.p-best.cd.m.p, c:R.c-best.cd.m.c }; fatRoom -= best.cd.m.f;
  }
  return { picks, note: picks.length ? '' : 'Nothing in your list fits without breaking a cap or the fat ceiling.' };
}

function macroRow(label, cssVar, val, target, kind){
  const pct = Math.max(0, Math.min(100, target ? val/target*100 : 0));
  const over = kind === 'ceiling' && val > target;
  const g = label === 'kcal' ? '' : ' g';
  const sub = kind === 'floor' ? (val >= target ? 'floor reached' : `${r0(target - val)}${g} to go`)
            : kind === 'ceiling' ? (val > target ? `${r0(val - target)}${g} over` : `${r0(target - val)}${g} room`)
            : (val > target ? `${r0(val - target)}${g} over` : `${r0(target - val)}${g} left`);
  return `<div class="macro" style="--c:var(${cssVar})">
    <div class="lab"><i></i>${label}</div>
    <div class="bar ${over ? 'over' : ''}" role="img" aria-label="${label} ${r0(val)} of ${target}"><i style="width:${pct}%"></i></div>
    <div class="val num">${r0(val)}${label === 'kcal' ? '' : `<span class="of"> / ${target}</span>`}<small>${label === 'kcal' ? `of ${target}` : sub}</small></div>
  </div>`;
}
function capChips(date){

}

function barChart(days, vals, target, color, floor){
  const W = 340, H = 132, top = 10, bot = 20, n = days.length, bw = W / n * 0.62, max = Math.max(target * 1.3, ...vals, 1);
  const y = v => top + (H - top - bot) * (1 - v / max);
  let s = `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Last ${n} days">`;
  vals.forEach((v, i) => {
    const x = i * (W / n) + (W / n - bw) / 2, hgt = v > 0 ? (H - top - bot) * v / max : 0;
    const done = days[i] < todayStr(), bad = done && (floor ? (v > 0 && v < target * 0.9) : (v > target * 1.1));
    s += `<rect x="${x.toFixed(1)}" y="${(H - bot - hgt).toFixed(1)}" width="${bw.toFixed(1)}" height="${hgt.toFixed(1)}" rx="3" fill="${bad ? 'var(--red)' : color}" opacity="${v>0?1:0}"/>`;
    if (i % 2 === n % 2) s += `<text x="${(x + bw/2).toFixed(1)}" y="${H - 5}" text-anchor="middle">${parseD(days[i]).getDate()}</text>`;
  });
  s += `<line x1="0" x2="${W}" y1="${y(target).toFixed(1)}" y2="${y(target).toFixed(1)}" stroke="var(--ink2)" stroke-width="1.2" stroke-dasharray="4 4"/>`;
  s += `<text x="${W-2}" y="${(y(target)-4).toFixed(1)}" text-anchor="end">${target}</text></svg>`;
  return s;
}
function spark(vals, w=84, h=30){
  if (vals.length < 2) return `<svg width="${w}" height="${h}" aria-hidden="true"><circle cx="${w-4}" cy="${h/2}" r="3" fill="var(--accent)"/></svg>`;
  const mn = Math.min(...vals), mx = Math.max(...vals), span = (mx - mn) || 1;
  const pts = vals.map((v,i) => [ (i/(vals.length-1))*(w-8)+4, h-4-((v-mn)/span)*(h-8) ]);
  return `<svg width="${w}" height="${h}" aria-hidden="true"><polyline points="${pts.map(p=>p.map(x=>x.toFixed(1)).join(',')).join(' ')}" fill="none" stroke="var(--accent)" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/><circle cx="${pts[pts.length-1][0].toFixed(1)}" cy="${pts[pts.length-1][1].toFixed(1)}" r="3.6" fill="var(--accent)"/></svg>`;
}
function viewProgress(){

  const kc = days.map(d => r0(sumMacros(dayEntries(d)).kcal)), pr = days.map(d => r0(sumMacros(dayEntries(d)).p));
  const logged = days.filter((d,i) => kc[i] > 0), avg = a => a.length ? r0(a.reduce((x,y)=>x+y,0)/a.length) : 0;
  const week = Array.from({ length:7 }, (_, i) => addDays(t, -i));

  const unit = 'font-family:var(--font);font-weight:500';
  let h = `<h1>Progress</h1><div class="group pad"><div class="stat">
    <div><div class="num">${sessions}</div><div class="small muted">workouts this week</div></div>
    <div><div class="num">${avg(pr.filter(x=>x>0))}</div><div class="small muted">avg protein, g</div></div>
    <div><div class="num">${fmtInt(avg(kc.filter(x=>x>0)))}</div><div class="small muted">avg kcal</div></div></div></div>`;
  h += `<h2>Calories, 14 days</h2><div class="group pad">${barChart(days, kc, S.settings.targets.training.kcal, 'var(--accent)', false)}<p class="note" style="margin:6px 0 0">Dashed line is the training-day target. Red bars are finished days over it by more than 10%.</p></div>`;
  h += `<h2>Protein, 14 days</h2><div class="group pad">${barChart(days, pr, S.settings.targets.training.p, 'var(--pro)', true)}<p class="note" style="margin:6px 0 0">Red bars are finished days more than 10% under the floor. ${logged.length} of 14 days have food logged.</p></div>`;

  }
  h += `<div class="row gap16"><input id="waistcm" class="field" style="max-width:120px" inputmode="decimal" placeholder="cm" aria-label="Waist in cm"><button class="btn small" data-act="addwaist">Save waist</button></div>
    <p class="note" style="margin:10px 0 0">Morning, after the toilet, before food, just below the navel. Skip it the day after a salty or heavy meal.</p></div>`;
  if (waist.length) h += `<div class="group">` + waist.slice().reverse().slice(0,6).map(x => `<div class="lift"><div><strong>${fmtW(x.cm)} cm</strong><div class="small muted">${dateLabel(x.date)}${x.note ? ', ' + esc(x.note) : ''}</div></div><span></span><button class="link" data-act="delwaist" data-date="${x.date}">Remove</button></div>`).join('') + `</div>`;

  h += `<h2>Lifts</h2>`;
  const rows = Object.keys(EX).map(id => {
    const ds = workoutDates().filter(d => setsDone(S.workouts[d], id).length);
    if (!ds.length) return null;
    const tops = ds.map(d => Math.max(...setsDone(S.workouts[d], id).map(s => +s.w || 0)));
    const lastSets = setsDone(S.workouts[ds[ds.length-1]], id), top = tops[tops.length-1];
    const reps = Math.max(...lastSets.filter(s => (+s.w||0) === top).map(s => +s.r));

  }).filter(Boolean);
  h += rows.length ? `<div class="group">${rows.join('')}</div>` : `<p class="empty">Log a workout and your lifts show up here.</p>`;
  return h;
}

  unskip(){ delete S.dismissed[ui.date]; saveState(); render(); },
  dropcarried(){ getPlan(ui.date).owed.forEach(o => { S.dismissed[o.from] = true; }); saveState(); render(); toast('Carried exercises dropped'); },
  addex(){ openSheet({ type:'exercise' }); },
  pickex(t){ const wk = ensureWk(ui.date); if (!wk.added) wk.added = []; if (!wk.added.includes(t.dataset.id)) wk.added.push(t.dataset.id);
    ui.open[ui.date + '|' + t.dataset.id] = true; saveState(); closeSheet(); render(); },
  daytype(t){ const d = S.days[ui.date] || (S.days[ui.date] = { entries:[] }); d.type = t.dataset.v; saveState(); render(); },
  slot(t){ ui.slot = t.dataset.v; render(); },
  quick(t){ const q = QUICK[+t.dataset.i]; q.items.forEach(([id, qty]) => addEntry(ui.date, foodById(id), qty, ui.slot)); toast(`${q.label} added to ${slotName(ui.slot)}`); render(); },
  gapadd(t){ const p = ui.gap[+t.dataset.i]; if (!p) return; addEntry(ui.date, p.food, p.qty, ui.slot); toast(`${p.food.name} added to ${slotName(ui.slot)}`); render(); },
  water(t){ const w = S.water[ui.date] || (S.water[ui.date] = { ml:0, creatine:false }); w.ml = Math.max(0, w.ml + +t.dataset.ml); saveState(); render(); },
  addfood(t){ openSheet({ type:'food', slot:t.dataset.slot || ui.slot, q:'', sel:null, qty:0, mode:'list' }); },
  sheetmode(t){ ui.sheet.mode = t.dataset.v; ui.sheet.sel = null; drawSheet(); },
  pickfood(t){ ui.sheet.sel = t.dataset.id; ui.sheet.qty = foodById(t.dataset.id).step; drawSheet(); },
  backlist(){ ui.sheet.sel = null; drawSheet(); },
  qtystep(t){ const f = foodById(ui.sheet.sel), inc = f.inc || (f.unit === 'g' ? 10 : 0.5);
    ui.sheet.qty = Math.max(0, Math.round((ui.sheet.qty + (+t.dataset.d) * inc) * 100) / 100); $('#qtyin').value = fmtW(ui.sheet.qty); updateQtyPreview(); },
  confirmfood(){ const sh = ui.sheet, f = foodById(sh.sel); if (!(sh.qty > 0)) { toast('Enter a quantity first'); return; }
    addEntry(ui.date, f, sh.qty, sh.slot); ui.slot = sh.slot; closeSheet(); render(); toast(`${f.name} added to ${slotName(sh.slot)}`); },
  confirmquick(){ const k = num($('#qe-k').value), p = num($('#qe-p').value) || 0, f = num($('#qe-f').value) || 0, c = num($('#qe-c').value) || 0;
    if (k === null) { toast('Enter the calories'); return; }
    const name = $('#qe-name').value.trim() || 'Quick entry', sh = ui.sheet;
    const e = { id:uid(), food:null, name, unit:'portion', qty:1, slot:sh.slot, kcal:k, p, f, c, k:{ kcal:k, p, f, c }, cap:null, capQty:0 };
    (S.days[ui.date] = S.days[ui.date] || { entries:[] }).entries.push(e);
    if ($('#qe-save').checked) S.foods.push({ id:'c_' + uid(), name, unit:'portion', group:'My foods', kcal:k, p, f, c, step:1, inc:0.5 });
    saveState(); closeSheet(); render(); toast(`${name} added`); },
  editentry(t){ openSheet({ type:'entry', id:t.dataset.id }); },
  entrystep(t){ const e = dayEntries(ui.date).find(x => x.id === ui.sheet.id), inp = $('#entryqty'), inc = e.unit === 'g' ? 10 : 0.5;
    inp.value = fmtW(Math.max(0, Math.round(((num(inp.value) || 0) + (+t.dataset.d) * inc) * 100) / 100)); inp.dispatchEvent(new Event('input', { bubbles:true })); },
  entryupdate(){ const e = dayEntries(ui.date).find(x => x.id === ui.sheet.id), q = num($('#entryqty').value);
    if (!e || q === null) return; const old = e.qty || 1;
    e.qty = q; e.kcal = e.k.kcal * q; e.p = e.k.p * q; e.f = e.k.f * q; e.c = e.k.c * q; e.capQty = e.cap ? e.capQty * q / old : 0;
    saveState(); closeSheet(); render(); toast('Updated'); },
  entrydelete(){ const d = S.days[ui.date]; d.entries = d.entries.filter(x => x.id !== ui.sheet.id); saveState(); closeSheet(); render(); toast('Removed'); },
  copyday(){ openSheet({ type:'copyday' }); },
  confirmcopy(){ const from = $('#copyd').value; if (!from || from === ui.date) { toast('Pick a different day'); return; }
    const src = dayEntries(from).filter(e => e.slot !== 'imported'); if (!src.length) { toast('No meals logged that day'); return; }
    const d = S.days[ui.date] || (S.days[ui.date] = { entries:[] }); src.forEach(e => d.entries.push({ ...deepClone(e), id:uid() }));
    saveState(); closeSheet(); render(); toast(`Copied ${src.length} items`); },
  addwaist(){ const v = num($('#waistcm').value); if (!v) { toast('Enter your waist in cm'); return; }
    const d = todayStr(); S.waist = S.waist.filter(x => x.date !== d); S.waist.push({ date:d, cm:v }); saveState(); render(); toast('Waist saved'); },
  delwaist(t){ S.waist = S.waist.filter(x => x.date !== t.dataset.date); saveState(); render(); },
  nfunit(t){ ui.nfUnit = t.dataset.v; $$('[data-act="nfunit"]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.v === ui.nfUnit))); },
  addfoodcustom(){ const name = $('#nf-name').value.trim(), k = num($('#nf-k').value);
    if (!name || k === null) { toast('Name and kcal are required'); return; }
    const pc = ui.nfUnit === 'pc';
    S.foods.push({ id:'c_' + uid(), name, unit: pc ? 'portion' : 'g', group:'My foods', kcal:k, p:num($('#nf-p').value)||0, f:num($('#nf-f').value)||0, c:num($('#nf-c').value)||0, step: pc ? 1 : 100, inc: pc ? 0.5 : 10 });
    saveState(); render(); toast(`${name} saved`); },
  delfood(t){ S.foods = S.foods.filter(f => f.id !== t.dataset.id); saveState(); render(); },
  export(){ const blob = new Blob([JSON.stringify(S, null, 2)], { type:'application/json' }), a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = `coach-backup-${todayStr()}.json`; document.body.appendChild(a); a.click(); a.remove(); toast('Backup downloaded'); },
  reset(){ if (confirm('Erase all logs, foods and settings on this device? This cannot be undone.')) { try { localStorage.removeItem(LS_KEY); } catch(e) {} S = freshState(); saveState(); render(); toast('Reset'); } },
  closesheet(){ closeSheet(); }
};

document.addEventListener('click', e => {
  const t = e.target.closest('[data-act]');
  if (t && H[t.dataset.act] && t.tagName !== 'INPUT') H[t.dataset.act](t, e);
});
document.addEventListener('input', e => {
  const t = e.target;
  if (t.dataset && t.dataset.bind === 'set') onSetInput(t);
  else if (t.id === 'q' && ui.sheet) { ui.sheet.q = t.value; $('#foodlist').innerHTML = foodListHTML(); }
  else if (t.id === 'qtyin' && ui.sheet) { const q = num(t.value); ui.sheet.qty = q === null ? 0 : q; updateQtyPreview(); }
  else if (t.id === 'entryqty' && ui.sheet) { const e2 = dayEntries(ui.date).find(x => x.id === ui.sheet.id), q = num(t.value) || 0; if (e2) $('#entryprev').innerHTML = previewHTML({ kcal:e2.k.kcal*q, p:e2.k.p*q, f:e2.k.f*q, c:e2.k.c*q }); }
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.dataset.chg === 'returning') { S.settings.returning = t.checked; saveState(); render(); }
  else if (t.dataset.chg === 'creatine') { const w = S.water[ui.date] || (S.water[ui.date] = { ml:0, creatine:false }); w.creatine = t.checked; saveState(); }
  else if (t.dataset.set) setPath(t.dataset.set, t.value);
  else if (t.id === 'importfile' && t.files && t.files[0]) {
    const rd = new FileReader();
    rd.onload = () => { try { const obj = JSON.parse(rd.result); if (!obj || !obj.settings || !obj.workouts) throw new Error('bad'); S = migrate(obj); saveState(); render(); toast('Backup imported'); }
      catch(err) { toast('That file is not a Coach backup'); } };
    rd.readAsText(t.files[0]);
  }
});
document.addEventListener('keydown', e => { if (e.key === 'Escape' && ui.sheet) closeSheet(); });
let _today = todayStr();
document.addEventListener('visibilitychange', () => {
  if (!document.hidden && todayStr() !== _today) { if (ui.date === _today) ui.date = todayStr(); _today = todayStr(); render(); }
});

if (typeof window !== 'undefined') window.__coach = { S: () => S, setS: v => { S = v; }, ui, render, getPlan, suggest, suggestGap, H, dayType, sumMacros, addEntry, foodById };
render();
</script>
</body>
</html>
