  if (!slots.length || left.kcal < 150) return { slots:[], left, T, cur };
  const room = Object.fromEntries(Object.keys(caps).map(k => [k, Math.max(0, caps[k] - used[k])]));
  const yesterday = new Set(dayEntries(addDays(date, -1)).map(e => e.food));
  const fourthLogged = logged.some(e => FOURTH_PROTEIN.includes(e.food)), office = OFFICE_DAYS.includes(wdOf(date));
  const shares = slots.reduce((a, s) => a + SLOT_SHARE[s], 0);
  // each slot: its ideas, ranked on their own merits (sized to the slot's plain share, for ranking only)
  const per = slots.map(slot => {
    const w = SLOT_SHARE[slot] / shares, need = { kcal:left.kcal * w, p:left.p * w };
    return mealCandidates(date, slot).map(m => {
      const sized = sizeMeal(m, room, need); if (!sized) return null;
      const ids = sized.items.map(i => i.food.id);
      let bonus = 0;
      if (m.office) bonus -= .5; else if (slot === 'lunch' && office && !m.learnedOnly) bonus += .3;
      bonus -= .12 * Math.log2(1 + m.count) + (m.last && diffDays(m.last, date) <= 14 ? .05 : 0) + (m.usual ? .25 : 0);   // your usual meals first
      if (ids.some(id => yesterday.has(id) && foodById(id).group === 'Protein' && !foodById(id).cap)) bonus += .08;   // a little variety
      if (ids.includes('pudding')) bonus += .15;   // puddings are limited for cost: only when they fit clearly better
      const rank = bonus + Math.abs(sized.m.kcal - need.kcal) / Math.max(need.kcal, 250) + .4 * Math.abs(sized.m.p - need.p) / Math.max(need.p, 15);
      return { tpl:m, bonus, rank, has4: ids.some(id => FOURTH_PROTEIN.includes(id)), office: m.office, count: m.count, usual: m.usual };
    }).filter(Boolean).sort((x, y) => x.rank - y.rank).slice(0, 12);
  }).map((list, i) => ({ slot: slots[i], list })).filter(x => x.list.length);
  // the whole rest of the day: try every combination, sizing each meal in order so what one meal leaves over
  // goes to the next, and keep the combination that lands best
  const search = force => {
    let best = null;
    const walk = (i, picks, tot, rm, has4, cost) => {
      if (i === per.length) {
        // as shares of the targets: each gram under the protein floor weighs about as much as 85 kcal off target
        let c = cost + 4 * Math.abs(tot.kcal - T.kcal) / T.kcal;
        c += 24 * Math.max(0, T.p - 3 - tot.p) / T.p + 5 * Math.max(0, tot.p - PLAN_MAX_P) / T.p + 6 * Math.max(0, tot.f - T.f) / T.f;
        if (!has4) c += 1;
        if (!best || c < best.cost) best = { cost:c, picks, tot, has4 };
        return;
      }
      const shareLeft = per.slice(i).reduce((a, x) => a + SLOT_SHARE[x.slot], 0), w = SLOT_SHARE[per[i].slot] / shareLeft;
      const need = { kcal:(T.kcal - tot.kcal) * w, p:(T.p - tot.p) * w };
      const opts = force[i] !== undefined ? [per[i].list[force[i]]] : per[i].list;
      for (const o of opts) {
        const sized = sizeMeal(o.tpl, rm, need); if (!sized) continue;
        const r2 = { ...rm };
        sized.items.forEach(({ food, qty }) => { if (food.cap) r2[food.cap] = Math.max(0, r2[food.cap] - qty * (food.capMul || 1)); });
        const M = sized.m, fit = Math.abs(M.kcal - need.kcal) / Math.max(need.kcal, 250) + .4 * Math.abs(M.p - need.p) / Math.max(need.p, 15);
        walk(i + 1, [...picks, { ...o, ...sized }], { kcal:tot.kcal + M.kcal, p:tot.p + M.p, f:tot.f + M.f, c:tot.c + M.c }, r2, has4 || o.has4, cost + fit + o.bonus);
      }
    };
    walk(0, [], { ...cur }, room, fourthLogged, 0);
    return best;
  };
  let best = search({});
  if (!best) return { slots:[], left, T, cur };
  // Another idea: move that slot to the next idea after the one first shown, and re-plan the others around it
  if (Object.values(alt).some(n => n > 0)) {
    const force = {};
    per.forEach((x, i) => { const n = alt[x.slot] || 0; if (n) force[i] = (x.list.findIndex(o => o.tpl === best.picks[i].tpl) + n) % x.list.length; });
    best = search(force) || best;
  }
  let firstFourth = !fourthLogged;
  const out = best.picks.map((pick, i) => {
    const reason = pick.office ? 'Canteen day. Pick the dish with the most protein.' : firstFourth && pick.has4 ? 'Brings your fourth protein source.'
      : pick.count >= 2 || pick.usual ? 'One of your usual meals.' : '';
    const tag = pick.office ? 'canteen, pick the most protein' : firstFourth && pick.has4 ? 'your fourth protein' : pick.count >= 2 || pick.usual ? 'your usual' : '';
    if (pick.has4) firstFourth = false;
    return { slot: per[i].slot, meal: { ...pick, reason, tag }, options: per[i].list.length };
  });
  return { slots:out, left, T, cur, total:best.tot, fourth:best.has4 };
}

/* ---------- rings ---------- */
function ringSVG(list, size, stroke, anim, cls=''){   // a ring can be thinner than the others with its own w
  const c = size / 2; let edge = 0;
  let s = `<svg class="rings ${anim ? 'anim' : ''} ${cls}" viewBox="0 0 ${size} ${size}" width="${size}" height="${size}" aria-hidden="true">`;
  list.forEach(r => {
    const w = r.w || stroke, rad = c - edge - w/2, C = 2*Math.PI*rad, p = Math.max(0, Math.min(1, r.pct || 0)), off = C*(1-p);
    edge += w + 3;
    s += `<circle cx="${c}" cy="${c}" r="${rad.toFixed(2)}" fill="none" stroke="${r.color}" stroke-opacity=".16" stroke-width="${w}"/>`;
    s += `<circle class="arc" cx="${c}" cy="${c}" r="${rad.toFixed(2)}" fill="none" stroke="${r.color}" stroke-width="${w}" stroke-linecap="round"
      stroke-dasharray="${C.toFixed(2)}" stroke-dashoffset="${off.toFixed(2)}" style="--c:${C.toFixed(2)}" opacity="${p > 0 ? 1 : 0}" transform="rotate(-90 ${c} ${c})"/>`;
  });
  return s + '</svg>';
}

/* ---------- lifts ---------- */
function getRows(date, id, sug){
  const saved = S.workouts[date] && S.workouts[date].ex && S.workouts[date].ex[id];
  if (saved && saved.length) return saved;
  return Array.from({ length: sug.sets }, () => ({ w: sug.w ?? '', r: '' }));
}
function ensureWk(date){ return S.workouts[date] || (S.workouts[date] = { ex:{}, added:[] }); }
function materialize(date, id){
  const wk = ensureWk(date);
  if (!wk.ex[id] || !wk.ex[id].length) wk.ex[id] = getRows(date, id, suggest(id, date)).map(r => ({ ...r }));
  return wk.ex[id];
}

function exHead(it, date){
  const c = cfg(it.id), sug = it.sug, wk = S.workouts[date];
  const done = setsDone(wk, it.id), key = date + '|' + it.id;
  let chip, wShow = sug.w;
  if (isNotDone(wk, it.id)) { chip = `<span class="chip low">${ICON.skip}Not done</span>`; if (done.length) wShow = topW(done); }
  else if (done.length) {
    const want = setTarget(wk, it);
    chip = done.length >= want ? `<span class="chip done">${ICON.check}Done</span>` : `<span class="chip part">${done.length} of ${want}</span>`;
    wShow = topW(done);
  } else {
    const cls = { go:'chip go', hold:'chip', low:'chip low', new:'chip new' }[sug.status];
    const lab = { go:'Add weight', hold:'Hold', low:'Lighter', new:'New' }[sug.status];
    chip = `<span class="${cls}">${lab}</span>`;
  }
  const reps = `<b>${sug.sets} × ${sug.low === sug.high ? sug.high : `${sug.low}–${sug.high}`}</b> reps${c.single ? '/side' : ''}`;
  // closed: the weight to load, the lift, the reps needed and its status; what was logged and the reasoning sit inside (exWhy)
  return `<button class="ex-head" data-act="openex" data-key="${esc(key)}" aria-expanded="${!!ui.open[key]}">
    <div class="wt num">${fmtW(wShow)}<small>${esc(c.unit)}</small></div>
    <div><div class="ex-name">${esc(c.name)}</div><div class="ex-reps">${reps}</div></div>
    <div>${chip}</div></button>`;
}
/* the reasoning behind the target and what was logged, shown only once the exercise is opened */
function exWhy(it, date){
  const sug = it.sug, done = setsDone(S.workouts[date], it.id);
  if (done.length) return `Logged ${done.map(s => `${fmtW(s.w)}×${s.r}`).join(', ')}. Next time: ${suggest(it.id, addDays(date, 1)).text}`;

/* A day with nothing to train gets one card instead of the session ring: what the day is, why, and one thing to do about it.
   A skipped or missed session is not a good thing, so it shows in red. */
function restCard(plan, date){
  const isToday = date === todayStr(), here = isToday ? 'today' : 'on this day', day = d => WD[wdOf(d)];
  const name = t => t && TEMPLATES[t] ? TEMPLATES[t].name : 'the session';
  const btn = (act, label, data = {}) => `<button class="btn soft block" data-act="${act}"${Object.entries(data).map(([k, v]) => ` data-${k}="${v}"`).join('')}${act === 'menu' ? ' data-menu="train" aria-haspopup="menu"' : ''}>${label}</button>`;
  let icon = ICON.zzz, title = 'Rest day', text, action = btn('menu', 'Choose a session'), bad = false;
  if (plan.past) {
    action = '';
    if (isRestDay(date)) text = 'A rest day in your week.';
    else if (missedDay(date)) { bad = true; icon = ICON.missed; title = S.dismissed[date] ? 'Session skipped' : 'Session missed'; text = `${name(sessionOn(date))} was planned and nothing was logged.`; }
    else { icon = ICON.dumb; title = 'No workout logged'; text = 'Nothing was logged on this day.'; }
  } else if (S.dismissed[date]) {
    bad = true; icon = ICON.missed; title = 'Session skipped';
    const free = weekDays(date).find(d => canSwapRest(d, date));   // a rest day still free this week: rest now instead
    if (free) {
      const fx = swapEffects(free, date).map(([d, t]) => `${day(d)} gets ${name(t)}`).join(', ');
      text = `You skipped ${name(sessionOn(date))}, but ${day(free)} is still a rest day. Rest ${here} instead${fx ? ` and ${fx}` : ''}.`;
      action = btn('swaprest', `Rest ${isToday ? 'today' : 'this day'} instead`, { rest:free, train:date });
    } else {
      text = `You skipped ${name(sessionOn(date))}. Its lifts show on your next training day, to do if you have time.`;
      action = btn('unskip', 'Bring it back');
    }
  } else if (plan.tid) {
    title = 'Recovery day'; text = `${name(plan.tid)} is planned, but those muscles need more rest. Train them next time.`;
  } else {
    // a session missed earlier this week can take this rest day's place
    const miss = weekDays(date).filter(d => d < date && missedDay(d) && canSwapRest(date, d)).pop();
    if (miss) {
      text = `You ${S.dismissed[miss] ? 'skipped' : 'missed'} ${name(sessionOn(miss))} on ${day(miss)}. Train ${name(sessionAfterSwap(date, miss, date))} ${here} and make ${day(miss)} your rest day?`;
      action = btn('swaprest', `Train it ${isToday ? 'today' : 'then'}`, { rest:date, train:miss });
    } else if (!markedRest(date)) text = `All your sessions are covered this week, so ${isToday ? 'today is' : 'this is'} a free rest day. Move it from ${'⋯'} on another day, or choose a session.`;
    else text = isToday ? 'Nothing planned today. Recover, or choose a session if you feel like training.' : 'Nothing planned for this day. You can still choose a session for it.';
  }
  return `<div class="group session restcard${bad ? ' bad' : ''}"><div class="rc"><span class="rc-ic" aria-hidden="true">${icon}</span><div><div class="rc-title">${title}</div><p class="rc-text">${esc(text)}</p></div></div>${action}</div>`;
}
function sessionCard(plan, date){

  const total = plan.items.reduce((a, it) => a + Math.max(setTarget(wk, it), setsDone(wk, it.id).length), 0);   // a lift marked as not done still counts: its sets are lost
  const done = plan.items.reduce((a, it) => a + setsDone(wk, it.id).length, 0);

  const nLogged = plan.items.filter(it => setsDone(wk, it.id).length).length;
  const meta = plan.past ? `${nLogged} of ${plan.items.length} exercise${plan.items.length === 1 ? '' : 's'} logged`

  let h = `<div class="group pad session">

      <div class="sring">${ringSVG([{ pct, color:'var(--accent)' }], 64, 8, ui.anim)}<div class="lbl">${total ? Math.round(pct*100) + '%' : '–'}</div></div>
      <div class="grow"><div class="session-title">${esc(plan.title)}</div><div class="meta">${meta}${done ? `, ${done} of ${total} sets done` : ''}</div></div>

}

function macroRow(label, cssVar, val, target, kind, on){
  const pct = Math.max(0, Math.min(100, target ? val/target*100 : 0));
  const over = kind === 'ceiling' && val > target;
  const g = label === 'Calories' ? ' kcal' : ' g';
  const sub = kind === 'floor' ? (val >= target ? 'floor reached' : `${r0(target - val)}${g} to go`)
            : kind === 'ceiling' ? (val > target ? `${r0(val - target)}${g} over` : `${r0(target - val)}${g} room`)
            : (val > target ? `${fmtInt(val - target)}${g} over` : `${fmtInt(target - val)}${g} left`);
  return `<div class="macro" style="--c:var(${cssVar})${on ? `;--on:${on}` : ''}">
    <div class="mtop"><span class="num">${fmtInt(val)}</span><span class="u">/ ${fmtInt(target)}${g}</span><span class="st">${sub}</span></div>
    <div class="mbar ${over ? 'over' : ''}" role="img" aria-label="${label} ${r0(val)} of ${target}${g}"><span class="ml" aria-hidden="true">${label}</span><i style="width:${pct}%"><span class="ml" aria-hidden="true">${label}</span></i></div>

function capChips(date){

    const cls = u[k] > cap + 0.001 ? 'over' : u[k] >= cap - 0.001 ? 'full' : '';

}
/* a food's name and its detail: "Tandoori chicken (edible meat)" is Tandoori chicken with edible meat beside the amount.

function barChart(days, vals, target, color, floor){
  const W = 340, H = 132, top = 10, bot = 20, n = days.length, bw = W / n * 0.6, max = Math.max(target * 1.3, ...vals, 1);
  const y = v => top + (H - top - bot) * (1 - v / max);
  let s = `<svg class="chart ${ui.anim ? 'anim' : ''}" viewBox="0 0 ${W} ${H}" role="img" aria-label="Last ${n} days">`;
  vals.forEach((v, i) => {
    const x = i * (W / n) + (W / n - bw) / 2, hgt = v > 0 ? (H - top - bot) * v / max : 0;
    const done = days[i] < todayStr(), bad = done && (floor ? (v > 0 && v < target * 0.9) : (v > target * 1.1));
    s += `<rect class="b" x="${x.toFixed(1)}" y="${(H - bot - hgt).toFixed(1)}" width="${bw.toFixed(1)}" height="${hgt.toFixed(1)}" rx="${Math.min(5, bw/2).toFixed(1)}" fill="${bad ? 'var(--red)' : color}" opacity="${v>0?1:0}" style="animation-delay:${i*28}ms"/>`;
    if (i % 2 === n % 2) s += `<text x="${(x + bw/2).toFixed(1)}" y="${H - 5}" text-anchor="middle">${parseD(days[i]).getDate()}</text>`;
  });
  s += `<line x1="0" x2="${W}" y1="${y(target).toFixed(1)}" y2="${y(target).toFixed(1)}" stroke="var(--ink3)" stroke-width="1.2" stroke-dasharray="4 4"/>`;
  s += `<text x="${W-2}" y="${(y(target)-4).toFixed(1)}" text-anchor="end">${target}</text></svg>`;
  return s;
}
function spark(vals, w=84, h=30){
  if (vals.length < 2) return `<svg width="${w}" height="${h}" aria-hidden="true"><circle cx="${w-4}" cy="${h/2}" r="3.6" fill="var(--accent)"/></svg>`;
  const mn = Math.min(...vals), mx = Math.max(...vals), span = (mx - mn) || 1;
  const pts = vals.map((v,i) => [ (i/(vals.length-1))*(w-8)+4, h-4-((v-mn)/span)*(h-8) ]);
  return `<svg width="${w}" height="${h}" aria-hidden="true"><polyline points="${pts.map(p=>p.map(x=>x.toFixed(1)).join(',')).join(' ')}" fill="none" stroke="var(--accent)" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/><circle cx="${pts[pts.length-1][0].toFixed(1)}" cy="${pts[pts.length-1][1].toFixed(1)}" r="3.6" fill="var(--accent)"/></svg>`;
}

  }).filter(Boolean);
  h += rows.length ? `<div class="group">${rows.join('')}</div>` : `<p class="empty">Log a workout and your lifts show up here.</p>`;

}

let toastT;
function toast(m, opts = {}){
  const el = $('#toast');
  // a tick when it worked, a red skip mark for a skipped or not done session, a red cross when something failed or is missing
  el.innerHTML = `<span class="ok${opts.bad || opts.err ? ' bad' : ''}">${opts.err ? ICON.close : opts.bad ? ICON.skip : ICON.check}</span><span>${esc(m)}</span>` + (opts.undo ? `<button class="link" data-act="undo" style="margin-left:4px">Undo</button>` : '');
  el.classList.add('low');   // every toast sits low, above the tab bar, the rest timer or the keyboard (Surath)
  el.hidden = false; void el.offsetWidth; requestAnimationFrame(() => el.classList.remove('ghost'));
  clearTimeout(toastT);
  toastT = setTimeout(() => { el.classList.add('ghost'); toastT = setTimeout(() => { el.hidden = true; }, 550); }, opts.undo || opts.err ? 5000 : 3000);   // long enough to read; failures and Undo 5 s (Surath found 1.9 and 4 s too short)
}
function hideToast(){ const el = $('#toast'); clearTimeout(toastT); el.classList.add('ghost'); toastT = setTimeout(() => { el.hidden = true; }, 550); }

/* alert: regular glass, bold left-aligned text, Cancel leading and the action trailing */
function askGlass(title, msg, okLabel){
  return new Promise(res => {
    const w = $('#alert');
    w.innerHTML = `<div class="alert glass ghost" role="alertdialog" aria-modal="true" aria-labelledby="alerttitle"><h4 id="alerttitle">${esc(title)}</h4><p>${esc(msg)}</p>
      <div class="row"><button class="btn tinted" data-alert="0">Cancel</button><button class="btn danger" data-alert="1">${esc(okLabel)}</button></div></div>`;
    w.hidden = false; void w.offsetWidth;
    requestAnimationFrame(() => { w.classList.add('open'); $('.alert', w).classList.remove('ghost'); });
    const done = v => { w.removeEventListener('click', on); w.classList.remove('open'); $('.alert', w).classList.add('ghost');
      setTimeout(() => { w.hidden = true; w.innerHTML = ''; }, reduced() ? 0 : 320); res(v); };
    const on = e => { const b = e.target.closest('[data-alert]'); if (b) done(b.dataset.alert === '1'); else if (e.target === w) done(false); };
    w.addEventListener('click', on);
    $('[data-alert="0"]', w).focus();
  });
}

}

     keyboard comes up over Coach AI, the field rides up with it on the keyboard's own curve, 8 pt above it instead of clear
     of the home indicator, and the conversation goes up only as far as its end has to: with room to spare the keyboard

/* Opened from the home screen: the title and week fade in, the toolbar glass materialises, the day's cards come in one
   after another, each fading in from half as large again while it shrinks to its own size, landing just apart, and last
   the tab bar slides up from the bottom.

   0.3 s on the simulator), and the start of the motion was lost before that. */
const LAUNCH_AT = 400;

  const fade = (el, delay, duration) => el.animate([{ opacity:0 }, { opacity:1 }], { duration, delay, easing:'cubic-bezier(.3,0,.3,1)', fill:'backwards' });
  [...$('#app').children].filter(c => c !== body).forEach(c => fade(c, at, 350));
  const tools = $$('#navbar .glass:not(.ghost)'); tools.forEach(g => g.classList.add('ghost'));
  setTimeout(() => tools.forEach(g => g.classList.remove('ghost')), at + 150);
  let k = 0;
  [...(body ? body.children : [])].forEach(c => {
    const r = c.getBoundingClientRect(); if (r.top > vh || !r.width) return;   // out of sight: nothing to show

    c.animate([{ transform:'scale(1.5)' }, { transform:'none' }], { duration:600, delay, easing:'cubic-bezier(.3,.6,.15,1)', fill:'backwards' });
    fade(c, delay, 300);

    tabs.classList.add('arrive'); html.classList.remove('launching'); setTimeout(() => tabs.classList.remove('arrive'), 700);
  }, at + 120 + 70 * Math.max(0, k - 1) + 250);
}

/* =====================================================================

/* merge two copies that both moved on from `base` (null on the first sync, so everything counts as changed) */
function merge3(base, a, b){
  const out = { ...deepClone(b), ...deepClone(a) }, O = base || {};

  const byDate = {
    days: (x, y) => { if (!x || !y) return x || y;
      // real logged food beats an imported day total (an estimate from the chat logs) for the same day
      const real = d => d.entries.some(e => e.slot !== 'imported');
      if (real(x) !== real(y)) return real(x) ? x : y;
      // the same food logged identically on both sides (like the starter day totals every install creates) is kept once
      const ids = new Set(x.entries.map(e => e.id)), sigs = new Set(x.entries.map(entrySig));
      return { ...y, ...x, entries: [...x.entries, ...y.entries.filter(e => !ids.has(e.id) && !sigs.has(entrySig(e)))] }; },
    workouts: (x, y) => { if (!x || !y) return x || y;
      const ex = { ...y.ex };
      Object.entries(x.ex || {}).forEach(([id, sets]) => { const done = l => (l || []).filter(isDoneSet).length; if (!ex[id] || done(sets) >= done(ex[id])) ex[id] = sets; });

    out[k] = r;

  const starts = [a.settings && a.settings.planStart, b.settings && b.settings.planStart].filter(Boolean).sort();

  return out;
}

async function cloudApi(method, body, query = ''){
  const r = await fetch('/api/sync' + query, { method, cache:'no-store',
    headers: Object.assign({ Authorization: 'Bearer ' + cloud.token }, body ? { 'Content-Type':'application/json' } : {}),
    body: body ? JSON.stringify(body) : undefined });

}
const pushBody = () => ({ baseRev: cloud.rev || 0, state: S, device: deviceName(), day: todayStr() });

      if ((res.status === 200 || res.status === 409) && res.data && res.data.state) {

   Progress to open it (`pullStart`): the page blurs and turns milky, the conversation sharpens in over it (after
   Revolut's AI), and closing shrinks it into a card that fades as the page comes back. Each message carries a short
   summary of your log (`chatSnapshot`); replies stream in, with a shimmering status line while Claude works.

  chat.loading = true;
  try {
    const j = await chatApi('GET');
    if (!chat.sending) {   // messages that never reached the server stay, in their place (one it had after all goes)
      const unsent = chat.msgs.filter(m => m.failed && !j.messages.some(x => x.qid && x.qid === m.qid));
      chat.msgs = j.messages.concat(unsent).sort((a, b) => a.ts - b.ts); chat.more = j.more;
      // a reply that was cut off on the phone but finished on the server: the error goes once the reply is here
      const t = chat.msgs[chat.msgs.length - 1], p = chat.msgs[chat.msgs.length - 2];
      if (chat.err && chat.err.kind === 'cut' && t && t.role === 'assistant' && !t.cut && p && chatSame(p, chat.err.retry)) chat.err = null;
    }
    chat.mode = j.mode; chat.ai = j.ai || null; chat.profile = j.profile; chat.spend = j.spend; chat.loadErr = null; chatCache();
    if (chat.open && !chat.sending) renderChatLog(true);
    const pe = $('#chatprofile');   // never redraw the page under someone typing their profile
    if (ui.tab === 'setup' && ui.setupPage === 'chat' && !(pe && document.activeElement === pe)) refreshSetup();
  } catch(e) { chat.loadErr = e.status === 401 ? 'auth' : 'net'; if (chat.open && !chat.msgs.length) renderChatLog(true); }
  finally { chat.loading = false; }
}

   (Surath found it too quick to see), and the blur spreads down slower still (he wanted to see it), with the conversation

    <div class="group">${sh.convs.map((c, i) => `<label class="frow improw"><input type="checkbox" data-act="chatimpsel" data-i="${i}" ${sh.sel.has(i) ? 'checked' : ''}>
      <span class="grow"><strong>${esc(c.title)}</strong><span class="small muted">${c.date ? dateLabel(fmtD(new Date(c.date))) + ', ' : ''}${c.msgs.length} message${c.msgs.length === 1 ? '' : 's'}</span></span></label>`).join('')}</div>
    <p class="note">${sh.sel.size ? `About ${fmtInt(tokens)} tokens${chat.mode === 'live' ? `, roughly €${eur.toFixed(2)} once` : ''}.` : 'Pick at least one chat.'}${tooMany ? ' That is more than Coach AI can read at once, so pick fewer.' : ''}</p>
    <button class="btn block" data-act="chatimpgo" ${!sh.sel.size || tooMany ? 'disabled' : ''}>Write my profile</button>`;
}
async function chatImport(force){
  const sh = ui.sheet; if (!sh || sh.type !== 'chatimport' || (sh.busy && !force)) return;
  const text = historyText(sh.convs.filter((c, i) => sh.sel.has(i)));
  sh.busy = true; drawSheet();
  try {
    const j = await chatApi('POST', '?distill=1', { text, force: !!force });
    chat.profile = j.profile; chat.profileDraft = null; if (j.spend) chat.spend = j.spend;   // the new profile, not an unsaved edit of the old one
    if (ui.sheet === sh) closeSheet(); render(); toast('Profile written. Check it below');
  } catch(e) {
    sh.busy = false; if (ui.sheet === sh) drawSheet();   // only its own sheet: another may have been opened while it read
    const err = e.body && e.body.error;
    if (!e.status) {   // the phone lost the answer; the server still finishes, saves and charges, so show what it saves
      chat.profile = null; chat.profileDraft = null;
      setTimeout(() => { chat.profile = null; chatLoad(); }, 60000);
      toast('Lost the connection while Coach AI read your chats. If it finished, the profile shows here in a minute.', { err:true });
    } else if (err === 'cap' && !force) {
      if (ui.sheet === sh && await askGlass('Over today’s limit', `Reading this goes past today’s €${e.body.spend ? e.body.spend.capEur : 1} for Coach AI. Read it anyway?`, 'Read it')) chatImport(true);
    } else toast(err === 'too-long' ? 'That is too much at once, pick fewer chats'
      : err === 'busy' ? 'Coach AI is still reading your chats. Check again in a minute.'
      : err === 'unfinished' ? 'Coach AI could not finish the profile. Try fewer chats.'
      : err === 'refusal' ? 'Coach AI could not write a profile from these chats.' : 'Could not write the profile', { err:true });
  }
}
$('#chat .chat-top .tbtn').innerHTML = ICON.close;
$('#chat .send').innerHTML = CI.send;

if (typeof window !== 'undefined') window.__coach = { chat: () => chat, openChat, closeChat, chatSnapshot, chatMD, S: () => S, setS: v => { S = v; }, ui, render, getPlan, sessionOn, isRestDay, RT, suggest, suggestGap, H, dayType, sumMacros, addEntry, foodById, mergeHistory, saveState: () => saveState(), cloud, syncNow, merge3, planDay };
render(); launch();
if (cloud.token) syncNow();
</script>
